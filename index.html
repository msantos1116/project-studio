'use strict';const KEY='project-studio-v2';const uid=()=>crypto.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initial=()=>({version:2,projects:[]});let data=initial(); // Account-scoped data is loaded only after authentication
let current=null,view='home',activeScene=null,activeSong=null,activeNote=null,activeCharacter=null,sceneTab='story',ideaFilter='All',ideaQuery='';const $=id=>document.getElementById(id);function save(){if(!cloudUser){cloudStatus('Sign in to save your work');return}try{const serialized=JSON.stringify(data);const key=accountDataKey();if(localStorage.getItem(key)===serialized)return;localStorage.setItem(key,serialized);$('saveStatus').textContent='✓ Saved on this device';cloudQueue()}catch(e){$('saveStatus').textContent='Storage full — export backup';toast('Could not save. Export your project now.')}}function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').style.display='none',2500)}function project(){return data.projects.find(p=>p.id===current)}function persist(){flushEditor();save();render()}function b(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}function blank(label,desc){return `<div class="empty"><strong>${esc(label)}</strong><p>${esc(desc)}</p></div>`}function field(id,label,value='',type='text'){return `<div class="field"><label for="${id}">${esc(label)}</label>${type==='textarea'?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" type="${type}" value="${esc(value)}">`}</div>`}function select(id,label,options,value){return `<div class="field"><label>${esc(label)}</label><select id="${id}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}function modal(html){$('modalRoot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){$('modalRoot').innerHTML=''}function setView(v){flushEditor();view=v;activeScene=null;activeSong=null;activeNote=null;activeCharacter=null;render()}function goHome(){flushEditor();current=null;setView('home')}function openProject(id){flushEdit function flushEditor(){clearTimeout(autosaveTimer);if(!current)return;let p=project();if(!p)return;const val=id=>$(id)?.value;
if(view==='scenes'&&activeScene){let s=p.scenes.find(x=>x.id===activeScene);if(s){if(val('sceneTitle')!==undefined)s.title=val('sceneTitle');if(val('sceneSummary')!==undefined)s.summary=val('sceneSummary');if(sceneTab==='music')s.songIds=[...document.querySelectorAll('.songLink:checked')].map(x=>x.value);else if(val('sceneBody')!==undefined)s[sceneTab==='story'?'story':sceneTab==='direction'?'direction':'script']=val('sceneBody');if($('sceneSection')){let secId=val('sceneSection');p.sections.forEach(x=>x.sceneIds=x.sceneIds.filter(i=>i!==s.id));if(secId)p.sections.find(x=>x.id===secId)?.sceneIds.push(s.id)}}}
if(view==='songs'&&activeSong){let x=p.songs.find(x=>x.id===activeSong);if(x){x.title=val('songTitle')??x.title;x.artist=val('songArtist')??x.artist;x.url=val('songUrl')??x.url;x.notes=val('songNotes')??x.notes}}

function loggedOutPage(){return `<div class="top"><div><div class="eyebrow">Your private creative workspace</div><h1 class="title">Welcome to Project Studio</h1><p class="sub">Sign in to load your projects securely from the cloud.</p></div></div><div class="panel"><h2>Sign in to continue</h2><p class="note">Your work is hidden when you are signed out. Your session will be remembered on this device.</p><div class="actions">${b('Log in / Create account','showLoginDialog()','primary')}</div></div>${legacyBackupAvailable()?`<div class="panel"><h3>Previous device backup</h3><p class="note">Older Project Studio versions saved a local library. It is preserved but not displayed while signed out. You may download a backup before migrating.</p>${b('Export previous local backup','exportLegacyBackup()','ghost')}</div>`:''}`}
function homePage(){return `<div class="top"><div><div class="eyebrow">Your creative universe</div><h1 class="title">Every story starts <span class="tagline">somewhere.</span></h1><p class="sub">Create your own structure. Follow the ideas wherever they lead.</p></div>${b('+ New project','newProject()','primary')}</div>${data.projects.length?`<div class="grid">${data.projects.map((p,i)=>`<article class="project"><div class="cover" style="--a:${esc(p.colors?.[0]||'#4d397b')};--b:${esc(p.colors?.[1]||'#172d47')}"></div><div class="projectbody"><div class="meta">${esc(p.type)} · ${p.scenes.length} scenes</div><h3>${esc(p.name)}</h3><div class="meta">${esc(p.description||'An unwritten possibility.')}</div><div class="actions">${b('Open',`openProject('${p.id}')`,'primary')}${b('Duplicate',`duplicateProject('${p.id}')`,'ghost')}</div></div></article>`).join('')}</div>`:blank('Your library is waiting','Create your first project to begin.')}`}
function newProject(){modal(`<h2>Create a project</h2><p class="note">Film and Book are labels, not rigid templates. All tools are optional.</p>${field('pname','Project name')}${select('ptype','Project type',['Film','Book','Other'],'Film')}${field('pdesc','Short description (optional)')}<div class="row">${b('Create project','createProject()','primary')}${b('Cancel','closeModal()','ghost')}</div>`);$('pname').focus()}function createProject(){let name=$('pname').value.trim();if(!name)return toast('Enter a project name');let p={id:uid(),name,type:$('ptype').value,description:$('pdesc').value,colors:['#4c3479','#183e53'],sections:[],scenes:[],songs:[],characters:[],notes:[],ideas:[],writing:'',tools:{ideas:true,plotline:true,scenes:true,writing:true,songs:true,characters:true,notebook:true},createdAt:Date.now()};data.projects.push(p);closeModal();current=p.id;setView('overview');save()}function duplicateProject(id){let p=data.projects.find(x=>x.id===id);let copy=JSON.parse(JSON.stringify(p));copy.id=uid();const ids=new Map();for(const group of ['sections','scenes','songs','characters','notes','ideas'])for(const x of copy[group]||[]){const old=x.id;x.id=uid();ids.set(old,x.id)}for(const x of copy.sections||[])x.sceneIds=(x.sceneIds||[]).map(id=>ids.get(id)||id);for(const x of copy.ideas||[])if(x.sceneId)x.sceneId=ids.get(x.sceneId)||x.sceneId;for(const x of copy.scenes||[])x.songIds=(x.songIds||[]).map(id=>ids.get(id)||id);copy.name+=' (copy)';copy.createdAt=Date.now();data.projects.push(copy);persist();toast('Project duplicated')}
function overviewPage(p){let cards=[['ideas','✦','Idea Board','Collect and connect unfinished ideas'],['plotline','◇','Plotline','Shape your story, your way'],['scenes','▣','Scenes','Capture moments and ideas'],['writing','✎','Writing','Manuscript or screenplay'],['songs','♫','Music','Build your sonic palette'],['characters','♙','Characters','Develop your cast'],['notebook','✧','Notebook','Collect thoughts and direction']];return `<div class="top"><div><div class="eyebrow">${esc(p.type)} / Creative workspace</div><h1 class="title">${esc(p.name)}</h1><p class="sub">${esc(p.description||'An open canvas for your next story.')}</p></div>${b('⚙ Customize','setView(\'settings\')')}</div><div class="grid">${cards.filter(c=>p.tools[c[0]]!==false).map(([v,icon,t,d])=>`<div class="panel" style="cursor:pointer;min-height:145px" onclick="setView('${v}')"><div style="font-size:28px;color:var(--accent)">${icon}</div><h3 style="margin:8px 0 3px">${t}</h3><div class="small">${d}</div></div>`).join('')}</div><div class="panel"><div class="eyebrow">At a glance</div><h2>${p.scenes.length} scenes · ${p.songs.length} songs · ${(p.ideas||[]).length} ideas · ${p.notes.length} notes</h2><p class="note">Start anywhere. You don't need to establish a plotline before writing scenes. Your edits now save automatically as you type.</p></div>`}
function plotlinePage(p){let assigned=new Set(p.sections.flatMap(s=>s.sceneIds||[]));let loose=p.scenes.filter(s=>!assigned.has(s.id));return `<div class="top"><div><div class="eyebrow">Structure / Completely optional</div><h1 class="title">Plotline</h1><p class="sub">Create your own acts, chapters, arcs, or sections. Nothing is predefined.</p></div>${b('+ Add section','addSection()','primary')}</div><div class="panel"><div class="row"><strong>Story arrangement</strong><span class="chip">${p.sections.length} sections</span></div><p class="note">Use ↑ ↓ to reorder sections or scenes. Assign scenes to a section from the scene editor.</p></div>${p.sections.map((s,i)=>`<div class="section"><div class="row"><div><h3>${esc(s.name)}</h3><div class="small">${(s.sceneIds||[]).length} scenes</div></div><div class="actions">${b('↑',`moveSection('${s.id}',-1)`,'ghost')}${b('↓',`moveSection('${s.id}',1)`,'ghost')}${b('Rename',`renameSection('${s.id}')`,'ghost')}${b('×',`removeSection('${s.id}')`,'danger')}</div></div>${(s.sceneIds||[]).map((id,j)=>{let sc=p.scenes.find(x=>x.id===id);return sc?`<div class="scenechip"><span onclick="editScene('${id}')">${esc(sc.title)}</span><div class="actions">${b('↑',`moveSceneWithin('${s.id}','${id}',-1)`,'ghost')}${b('↓',`moveSceneWithin('${s.id}','${id}',1)`,'ghost')}</div></div>`:''}).join('')||'<p class="small">No scenes in this section yet</p>'}</div>`).join('')}${loose.length?`<div class="section"><h3>Unassigned scenes</h3><p class="small">Ideas that haven't found a place in the plotline yet.</p>${loose.map(s=>`<div class="scenechip" onclick="editScene('${s.id}')">${esc(s.title)} →</div>`).join('')}</div>`:''}${!p.sections.length&&!loose.length?blank('A blank plotline','Add sections when you are ready—or create scenes first.'):''}`}
function addSection(){modal(`<h2>New plotline section</h2>${field('secname','Section title','','text')}<p class="note">Examples: Act One, Chapter 3, The Reunion, or anything you invent.</p><div class="row">${b('Add section','createSection()','primary')}${b('Cancel','closeModal()')}</div>`)}function createSection(){let n=$('secname').value.trim();if(!n)return;project().sections.push({id:uid(),name:n,sceneIds:[]});closeModal();persist()}function renameSection(id){let s=project().sections.find(x=>x.id===id);modal(`<h2>Rename section</h2>${field('secname','Title',s.name)}${b('Save',`saveSectionName('${id}')`,'primary')} ${b('Cancel','closeModal()')}`)}function saveSectionName(id){let n=$('secname').value.trim();if(n)project().sections.find(s=>s.id===id).name=n;closeModal();persist()}function removeSection(id){if(!confirm('Remove this section? Its scenes will remain in your project as unassigned scenes.'))return;project().sections=project().sections.filter(s=>s.id!==id);persist()}function moveSection(id,d){let a=project().sections,i=a.findIndex(s=>s.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];persist()}function moveSceneWithin(sid,id,d){let a=project().sections.find(s=>s.id===sid).sceneIds,i=a.indexOf(id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];persist()}
function scenesPage(p){return `<div class="top"><div><div class="eyebrow">Story building</div><h1 class="title">Scenes</h1><p class="sub">Capture fragments, develop them, and connect them to the larger story.</p></div>${b('+ New scene','newScene()','primary')}</div><div class="two"><div class="panel"><div class="eyebrow">Scene library</div><div class="stack" style="margin-top:12px">${p.scenes.map(s=>`<div class="item ${activeScene===s.id?'selected':''}" onclick="editScene('${s.id}')"><h3>${esc(s.title)}</h3><div class="small">${esc(s.summary||'No description yet')}</div></div>`).join('')||blank('No scenes yet','Add your first moment.')}</div></div><div class="panel">${activeScene?sceneEditor(p):blank('Choose a scene','Select a scene on the left, or create a new one.')}</div></div>`}
function newScene(){flushEditor();let s={id:uid(),title:'Untitled scene',summary:'',story:'',direction:'',script:'',songIds:[],characterIds:[]};project().scenes.push(s);activeScene=s.id;sceneTab='story';view='scenes';save();render()}function editScene(id){flushEditor();activeScene=id;view='scenes';sceneTab='story';render()}function sceneEditor(p){let s=p.scenes.find(x=>x.id===activeScene);if(!s)return '';let sect=p.sections.find(x=>(x.sceneIds||[]).includes(s.id));return `<div class="row"><h2 style="margin:0">Scene editor</h2>${b('Delete scene',`deleteScene('${s.id}')`,'danger')}</div>${field('sceneTitle','Scene title',s.title)}${field('sceneSummary','One-line summary',s.summary)}<div class="field"><label>Plotline section (optional)</label><select id="sceneSection"><option value="">Unassigned</option>${p.sections.map(x=>`<option value="${x.id}" ${sect?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="tabbar">${[['story','Story'],['direction','Direction / imagery'],['script','Written scene'],['music','Linked songs']].map(([v,t])=>`<button class="${sceneTab===v?'active':''}" onclick="changeSceneTab('${v}')">${t}</button>`).join('')}</div>${sceneTab==='music'?`<div class="field"><label>Associated songs</label>${p.songs.length?p.songs.map(x=>`<label style="display:block;margin:8px 0"><input type="checkbox" class="songLink" value="${x.id}" ${(s.songIds||[]).includes(x.id)?'checked':''}> ${esc(x.title)} — ${esc(x.artist)}</label>`).join(''):'<p class="note">Add songs in the Music module first.</p>'}</div>`:field('sceneBody',sceneTab==='story'?'What happens?':sceneTab==='direction'?'Visual and directorial notes':'Manuscript or screenplay passage',s[sceneTab==='story'?'story':sceneTab==='direction'?'direction':'script'],'textarea')}<div class="row">${b('Save scene',`saveScene('${s.id}')`,'primary')}<span class="small">Changes are stored locally</span></div>`}
function changeSceneTab(tab){flushEditor();sceneTab=tab;render()}function saveScene(id,redraw=true){let p=project(),s=p.scenes.find(x=>x.id===id);if(!s)return;s.title=$('sceneTitle')?.value||s.title;s.summary=$('sceneSummary')?.value||'';let key=sceneTab==='story'?'story':sceneTab==='direction'?'direction':'script';if(sceneTab==='music')s.songIds=[...document.querySelectorAll('.songLink:checked')].map(x=>x.value);else s[key]=$('sceneBody')?.value||'';let secId=$('sceneSection')?.value||'';p.sections.forEach(x=>x.sceneIds=x.sceneIds.filter(i=>i!==id));if(secId)p.sections.find(x=>x.id===secId)?.sceneIds.push(id);save();if(redraw){render();toast('Scene saved')}}function deleteScene(id){if(!confirm('Delete this scene?'))return;let p=project();p.scenes=p.scenes.filter(s=>s.id!==id);p.sections.forEach(s=>s.sceneIds=s.sceneIds.filter(x=>x!==id));activeScene=null;persist()}
function writingPage(p){return `<div class="top"><div><div class="eyebrow">Long-form writing</div><h1 class="title">Writing</h1><p class="sub">A freeform writing space, alongside passages saved in individual scenes.</p></div>${b('Save writing','saveWriting()','primary')}</div><div class="panel">${field('writingBody','Project manuscript / screenplay',p.writing||'','textarea')}<p class="note">Scene-specific writing stays in the scene editor. This is an additional project-wide document.</p></div><div class="panel"><h3>Scene passages</h3>${p.scenes.filter(s=>s.script?.trim()).map(s=>`<div class="section"><strong>${esc(s.title)}</strong><p style="white-space:pre-wrap">${esc(s.script)}</p></div>`).join('')||'<p class="note">No scene passages yet.</p>'}</div>`}function saveWriting(){project().writing=$('writingBody').value;save();toast('Writing saved')}
function songsPage(p){return `<div class="top"><div><div class="eyebrow">Music and inspiration</div><h1 class="title">Music</h1><p class="sub">Build a soundtrack or simply collect the songs that spark ideas.</p></div>${b('+ Add song','newSong()','primary')}</div><div class="two"><div class="panel"><div class="stack">${p.songs.map(s=>`<div class="item ${activeSong===s.id?'selected':''}" onclick="editSong('${s.id}')"><h3>♫ ${esc(s.title)}</h3><div class="small">${esc(s.artist)}</div></div>`).join('')||blank('No songs yet','Add a song to your project.')}</div></div><div class="panel">${activeSong?songEditor(p):blank('Song notes','Select a song to capture its imagery, emotion, or story ideas.')}</div></div>`}function newSong(){let s={id:uid(),title:'Untitled song',artist:'',url:'',notes:''};project().songs.push(s);activeSong=s.id;persist()}function editSong(id){flushEditor();activeSong=id;render()}function songEditor(p){let s=p.songs.find(x=>x.id===activeSong);return `<h2>Song details</h2>${field('songTitle','Title',s.title)}${field('songArtist','Artist',s.artist)}${field('songUrl','Spotify / reference URL',s.url)}${field('songNotes','Images, emotions, interpretations',s.notes,'textarea')}<div class="row">${b('Save song',`saveSong('${s.id}')`,'primary')}${b('Delete',`deleteSong('${s.id}')`,'danger')}</div>`}function saveSong(id){let s=project().songs.find(x=>x.id===id);s.title=$('songTitle').value;s.artist=$('songArtist').value;s.url=$('songUrl').value;s.notes=$('songNotes').value;persist();toast('Song saved')}function deleteSong(id){if(!confirm('Delete song?'))return;let p=project();p.songs=p.songs.filter(x=>x.id!==id);p.scenes.forEach(s=>s.songIds=s.songIds.filter(x=>x!==id));activeSong=null;persist()}
function charactersPage(p){return `<div class="top"><div><div class="eyebrow">People and perspectives</div><h1 class="title">Characters</h1><p class="sub">Develop characters, motivations, contradictions, and arcs.</p></div>${b('+ Add character','newCharacter()','primary')}</div><div class="two"><div class="panel"><div class="stack">${p.characters.map(c=>`<div class="item ${activeCharacter===c.id?'selected':''}" onclick="flushEditor();activeCharacter='${c.id}';render()"><h3>${esc(c.name)}</h3><div class="small">${esc(c.role)}</div></div>`).join('')||blank('No characters yet','Start with a name or an idea.')}</div></div><div class="panel">${activeCharacter?characterEditor(p):blank('Character profile','Select a character to edit.')}</div></div>`}function newCharacter(){let c={id:uid(),name:'Unnamed character',role:'',notes:''};project().characters.push(c);activeCharacter=c.id;persist()}function characterEditor(p){let c=p.characters.find(x=>x.id===activeCharacter);return `<h2>Character profile</h2>${field('charName','Name',c.name)}${field('charRole','Role / relationship',c.role)}${field('charNotes','Background, motivation, arc',c.notes,'textarea')}<div class="row">${b('Save',`saveCharacter('${c.id}')`,'primary')}${b('Delete',`deleteCharacter('${c.id}')`,'danger')}</div>`}function saveCharacter(id){let c=project().characters.find(x=>x.id===id);c.name=$('charName').value;c.role=$('charRole').value;c.notes=$('charNotes').value;persist()}function deleteCharacter(id){if(!confirm('Delete character?'))return;project().characters=project().characters.filter(x=>x.id!==id);activeCharacter=null;persist()}
function notebookPage(p){return `<div class="top"><div><div class="eyebrow">Creative fragments</div><h1 class="title">Notebook</h1><p class="sub">A home for ideas that aren't ready to become scenes.</p></div>${b('+ New note','newNote()','primary')}</div><div class="two"><div class="panel"><div class="stack">${p.notes.map(n=>`<div class="item ${activeNote===n.id?'selected':''}" onclick="flushEditor();activeNote='${n.id}';render()"><h3>${esc(n.title)}</h3><div class="small">${esc(n.body.slice(0,100))}</div></div>`).join('')||blank('No notes yet','Capture an idea, however unfinished.')}</div></div><div class="panel">${activeNote?noteEditor(p):blank('Notebook','Select or create a note.')}</div></div>`}function newNote(){let n={id:uid(),title:'Untitled note',body:''};project().notes.push(n);activeNote=n.id;persist()}function noteEditor(p){let n=p.notes.find(x=>x.id===activeNote);return `<h2>Notebook entry</h2>${field('noteTitle','Title',n.title)}${field('noteBody','Note',n.body,'textarea')}<div class="row">${b('Save',`saveNote('${n.id}')`,'primary')}${b('Delete',`deleteNote('${n.id}')`,'danger')}</div>`}function saveNote(id){let n=project().notes.find(x=>x.id===id);n.title=$('noteTitle').value;n.body=$('noteBody').value;persist()}function deleteNote(id){if(!confirm('Delete note?'))return;project().notes=project().notes.filter(x=>x.id!==id);activeNote=null;persist()}
const IDEA_TYPES=['Thought','Scene seed','Dialogue','Visual','Music','Character','Research'];const IDEA_COLORS=['#334e78','#5b3a76','#275b62','#684a37','#4d6250','#6a3657'];
function ideasPage(p){p.ideas??=[];let cards=p.ideas.filter(x=>(ideaFilter==='All'||x.type===ideaFilter)&&(!ideaQuery||[x.title,x.body,x.type].join(' ').toLowerCase().includes(ideaQuery.toLowerCase())));return `<div class="top"><div><div class="eyebrow">Creative playground / No structure required</div><h1 class="title">Idea Board <span class="tagline">✦</span></h1><p class="sub">Collect fragments. Move them around. Turn an idea into a scene when it feels ready.</p></div>${b('+ Capture idea','newIdea()','primary')}</div><div class="idea-toolbar"><input class="idea-search" aria-label="Search ideas" placeholder="Search your ideas…" value="${esc(ideaQuery)}" oninput="ideaQuery=this.value;refreshIdeas()"><select class="idea-search" aria-label="Filter idea type" onchange="ideaFilter=this.value;refreshIdeas()"><option>All</option>${IDEA_TYPES.map(t=>`<option ${ideaFilter===t?'selected':''}>${t}</option>`).join('')}</select>${b('Reset filters','resetIdeaFilters()','ghost')}<span class="chip">${cards.length} / ${p.ideas.length} ideas</span></div><div class="idea-board" id="ideaBoard">${cards.map(x=>`<article class="idea-card" draggable="true" data-id="${x.id}" style="--idea-color:${IDEA_COLORS.includes(x.color)?x.color:IDEA_COLORS[0]}" ondragstart="ideaDragStart(event,'${x.id}')" ondragover="ideaDragOver(event,'${x.id}')" ondragleave="this.classList.remove('over')" ondrop="ideaDrop(event,'${x.id}')" ondragend="ideaDragEnd()"><div class="row"><span class="idea-type">${esc(x.type)}</span><button onclick="editIdea('${x.id}')" title="Edit idea">✎ Edit</button></div><h3>${esc(x.title||'Untitled idea')}</h3><p>${esc((x.body||'').slice(0,300))}${(x.body||'').length>300?'…':''}</p><div class="idea-bottom"><span class="idea-preview">${x.sceneId?'Linked to scene':'Unassigned idea'}</span><button onclick="makeSceneFromIdea('${x.id}')" title="Create a new scene from this idea">↗ Scene</button></div></article>`).join('')}<div class="idea-drop" ondragover="event.preventDefault()" ondrop="ideaDrop(event,null)" onclick="newIdea()">＋ Add another idea</div></div><p class="note">Drag cards to change their order. Your ideas are saved automatically on this device. Creating a scene keeps the original idea.</p>`}
function refreshIdeas(){
 // Only replace search results, never the focused search input or its toolbar.
 // Rebuilding #app on each keystroke interrupts typing and IME composition.
 const p=project(),board=$('ideaBoard');
 if(!p||!board)return;
 const template=document.createElement('template');
 template.innerHTML=ideasPage(p);
 const updatedBoard=template.content.querySelector('#ideaBoard');
 if(updatedBoard)board.innerHTML=updatedBoard.innerHTML;
 const updatedCount=template.content.querySelector('.idea-toolbar .chip');
 const currentCount=document.querySelector('#app .idea-toolbar .chip');
 if(updatedCount&&currentCount)currentCount.textContent=updatedCount.textContent;
}
function resetIdeaFilters(){ideaFilter='All';ideaQuery='';render()}
function newIdea(){editIdea(null)}
function editIdea(id){flushEditor();let x=id?(project().ideas||[]).find(a=>a.id===id):null;modal(`<div class="idea-editor"><div class="eyebrow">${x?'Edit your idea':'Capture something new'}</div><h2>${x?'Develop this idea':'New idea'}</h2>${field('ideaTitle','Title',x?.title||'')}${select('ideaType','Kind of idea',IDEA_TYPES,x?.type||'Thought')}${field('ideaBody','Describe it — a fragment is enough',x?.body||'','textarea')}<div class="field"><label>Card color</label><div class="row" style="justify-content:flex-start">${IDEA_COLORS.map(c=>`<label title="Color ${c}" style="display:inline-flex;align-items:center;gap:4px"><input type="radio" name="ideaColor" value="${c}" ${c===(x?.color||IDEA_COLORS[0])?'checked':''}><span style="width:25px;height:25px;border-radius:8px;background:${c};display:inline-block"></span></label>`).join('')}</div></div><div class="row">${b(x?'Save changes':'Add to board',`saveIdea(${id?`'${id}'`:'null'})`,'primary')}${x?b('Delete idea',`deleteIdea('${id}')`,'danger'):''}${b('Cancel','closeModal()','ghost')}</div></div>`);$('ideaTitle').focus()}
function saveIdea(id){let p=project();p.ideas??=[];let x=id?p.ideas.find(a=>a.id===id):null;if(!x){x={id:uid(),sceneId:null};p.ideas.push(x)}x.title=$('ideaTitle').value.trim()||'Untitled idea';x.type=$('ideaType').value;x.body=$('ideaBody').value;x.color=document.querySelector('input[name="ideaColor"]:checked')?.value||IDEA_COLORS[0];x.updatedAt=Date.now();closeModal();save();render();toast('Idea saved')}
function deleteIdea(id){if(!confirm('Delete this idea? Linked scenes will not be deleted.'))return;project().ideas=project().ideas.filter(x=>x.id!==id);closeModal();save();render()}
function makeSceneFromIdea(id){flushEditor();let p=project(),x=(p.ideas||[]).find(a=>a.id===id);if(!x)return;let s={id:uid(),title:x.title||'Untitled scene',summary:'',story:x.body||'',direction:'',script:'',songIds:[],characterIds:[]};p.scenes.push(s);x.sceneId=s.id;activeScene=s.id;sceneTab='story';view='scenes';save();render();toast('Scene created; original idea kept')}
let draggedIdea=null;function ideaDragStart(e,id){draggedIdea=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);e.currentTarget.classList.add('dragging')}
function ideaDragOver(e,id){if(!draggedIdea||draggedIdea===id)return;e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('over')}
function ideaDragEnd(){draggedIdea=null;document.querySelectorAll('.idea-card').forEach(x=>x.classList.remove('dragging','over'))}

function settingsPage(p){let tools=[['ideas','Idea Board'],['plotline','Plotline'],['scenes','Scenes'],['writing','Writing'],['songs','Music'],['characters','Characters'],['notebook','Notebook']];return `<div class="top"><div><div class="eyebrow">Project preferences</div><h1 class="title">Project settings</h1><p class="sub">Make the workspace fit the story, not the other way around.</p></div></div><div class="panel">${field('settingsName','Project title',p.name)}${select('settingsType','Project type',['Film','Book','Other'],p.type)}${field('settingsDesc','Description',p.description,'textarea')}${b('Save details','saveSettings()','primary')}</div><div class="panel"><h3>Visible modules</h3><p class="note">Hiding a module does not delete its data.</p><div class="toolgrid">${tools.map(([k,t])=>`<label class="tool"><input type="checkbox" ${p.tools[k]!==false?'checked':''} onchange="toggleTool('${k}',this.checked)"> <b style="display:inline">${t}</b></label>`).join('')}</div></div><div class="panel"><h3>Project actions</h3><div class="actions">${b('Duplicate project',`duplicateProject('${p.id}')`)}${b('Delete project',`deleteProject('${p.id}')`,'danger')}</div></div>`}function saveSettings(){let p=project();p.name=$('settingsName').value.trim()||p.name;p.type=$('settingsType').value;p.description=$('settingsDesc').value;persist();toast('Settings saved')}function toggleTool(k,v){project().tools[k]=v;save();renderNav()}function deleteProject(id){if(!confirm('Permanently delete this project and its contents? Export a backup first if needed.'))return;data.projects=data.projects.filter(p=>p.id!==id);current=null;view='home';persist()}

let cloudClientSignature='', cloudAuthSubscription=null, cloudConnectPending=false;
async function cloudInitialize(){
 const c=cloudConfig();
 if(!c?.url||!c?.key){cloudStatus('Cloud configuration is unavailable');return}
 if(cloudConnectPending){cloudStatus('Connection already in progress…');return}
 cloudConnectPending=true;
 try{
  cloudStatus('Loading Supabase client…');
  await ensureSupabaseLibrary();
  const signature=c.url+'|'+c.key;
  if(!cloudClient||cloudClientSignature!==signature){
   if(cloudAuthSubscription){cloudAuthSubscription.unsubscribe();cloudAuthSubscription=null}
   cloudClient=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'project-studio-auth-v7'}});
   cloudClientSignature=signature;
   const {data:listener}=cloudClient.auth.onAuthStateChange((event,session)=>{
    const oldId=cloudUser?.id||null;
    const nextUser=session?.user||null;
    if(event==='SIGNED_OUT'){
     cloudSessionGeneration++;cloudUser=null;clearWorkspace();cloudStatus('Signed out — your projects are hidden');
    }else if(nextUser&&oldId!==nextUser.id){
     cloudSessionGeneration++;cloudUser=nextUser;clearWorkspace();restoreAccountDraft(nextUser.id);
     cloudStatus('Loading your cloud library…');setTimeout(()=>cloudAutoLoad(),0);
    }else if(nextUser){cloudUser=nextUser;if(event==='SIGNED_IN'&&!cloudReady)setTimeout(()=>cloudAutoLoad(),0)}
    if(event==='PASSWORD_RECOVERY')setTimeout(showRecoveryDialog,0);
   });
   cloudAuthSubscription=listener.subscription;
  }
  // getSession is local and doesn't depend on an auth network request.
  const {data:sessionData,error:sessionError}=await cloudClient.auth.getSession();
  if(sessionError)throw sessionError;
  const restoredUser=sessionData?.session?.user||null;
  if(restoredUser&&cloudUser?.id!==restoredUser.id){cloudSessionGeneration++;cloudUser=restoredUser;restoreAccountDraft(restoredUser.id)}
  if(!restoredUser){cloudUser=null;clearWorkspace()}
  cloudStatus('Checking connection to Supabase…');
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),9000);
  try{
   const response=await fetch(c.url+'/auth/v1/health',{headers:{apikey:c.key},signal:controller.signal});
   if(!response.ok)throw Error('Supabase returned HTTP '+response.status+'; check project URL and publishable key');
  }finally{clearTimeout(timeout)}
  cloudStatus(cloudUser?'✓ Connected; signed in as '+cloudUser.email:'✓ Connected to Supabase. Sign in or create your private account.');
   if(cloudUser)await cloudAutoLoad();
 }catch(e){
  const message=e?.name==='AbortError'?'Connection timed out. Check your internet connection, network restrictions, or Supabase project status.':e?.message||String(e);
  cloudStatus('Connection error: '+message);
  console.error('Project Studio connection error:',e);
 }finally{cloudConnectPending=false}
}

 if(hasUnsyncedChanges()){
  if(!confirm('Some changes are not yet synchronized. Export a JSON backup before signing out. Choose OK to download the backup and stay signed in; Cancel to stay signed in without exporting.'))return;
  exportData();cloudStatus('Backup downloaded. Please wait for synchronization before logging out.');return;
 }
 try{if(cloudClient){const {error}=await cloudClient.auth.signOut();if(error)throw error;}}
 catch(e){return cloudStatus('Sign-out failed: '+(e?.message||String(e)))}
 cloudSessionGeneration++;cloudUser=null;clearWorkspace();cloudStatus('Signed out');
}
function cloudDisconnect(){if(cloudAuthSubscription){cloudAuthSubscription.unsubscribe();cloudAuthSubscription=null}cloudReady=false;cloudUser=null;cloudClient=null;cloudClientSignature='';cloudRevision=null;cloudLastSynced=null;cloudDirty=true;cloudStopTimers();localStorage.removeItem(CLOUD_CONFIG_KEY);cloudStatus('Disconnected; projects remain saved locally');render()}
async function cloudFetch(){if(!cloudClient||!cloudUser)throw Error('Sign in first');let {data:row,error}=await cloudClient.from('studio_documents').select('content,revision').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;return row}
 async function cloudDownload(){
  try{
   flushEditor();if(!cloudUser)throw Error('Sign in first');
   cloudStatus('Checking cloud library…');const row=await cloudFetch();
   if(!row){cloudStatus('No cloud library exists. Choose Upload this device’s projects to create it.');return}
   if(!Array.isArray(row.content?.projects))throw Error('Cloud data format is invalid');
   if(data.projects.length&&!confirm('This will REPLACE projects on this device with the cloud copy. Confirm that you exported your latest local JSON backup before proceeding. Continue?')){cloudStatus('Download canceled; local work unchanged.');return}
   data=row.content;cloudRevision=row.revision;cloudReady=true;cloudDirty=false;cloudLastSynced=cloudSnapshot();clearCloudPending();cloudStopTimers();current=null;view='home';
   localStorage.setItem(accountDataKey(),JSON.stringify(data));render();cloudStatus('✓ Cloud projects downloaded · Auto-sync active (revision '+cloudRevision+')');
  }catch(e){cloudStatus('Download failed: '+e.message);console.error('Cloud download failed',e)}
 }
 async function cloudUploadInitial(){
  try{
   flushEditor();if(!cloudUser)throw Error('Sign in first');
   cloudStatus('Checking whether a cloud library exists…');const row=await cloudFetch();
   if(row){cloudStatus('Cloud library already exists (revision '+row.revision+'). Download only after backing up local edits. No changes uploaded.');return}
   if(!data.projects.length){cloudStatus('No local projects to upload. Create or import a project first.');return}
   if(!confirm('Create a new cloud library from this device’s '+data.projects.length+' projects?'))return;
   const snapshot=JSON.parse(JSON.stringify(data));
   const {data:r,error}=await cloudClient.rpc('studio_save_document',{expected_revision:null,new_content:snapshot});
   if(error)throw error;
   cloudRevision=r;cloudReady=true;cloudDirty=false;cloudLastSynced=JSON.stringify(snapshot);clearCloudPending();cloudStopTimers();cloudStatus('✓ Cloud library created · Auto-sync active (revision '+r+')');
  }catch(e){cloudStatus('Upload failed: '+e.message);console.error('Cloud initial upload failed',e)}
 }
 async function cloudPush(){
  if(!cloudReady||!cloudUser||cloudBusy)return;
  flushEditor();const serialized=cloudSnapshot();
  if(serialized===cloudLastSynced){cloudDirty=false;clearCloudPending();cloudStopTimers();cloudStatus('✓ All changes saved · Cloud revision '+cloudRevision);return}
  cloudBusy=true;cloudDirty=false;cloudStopTimers();
  const ownerId=cloudUser.id,generation=cloudSessionGeneration;
  const snapshot=JSON.parse(serialized);
  cloudStatus('Uploading changes to cloud…');
  try{
   const {data:r,error}=await cloudClient.rpc('studio_save_document',{expected_revision:cloudRevision,new_content:snapshot});
   if(error)throw error;
   if(cloudSessionGeneration!==generation||cloudUser?.id!==ownerId)return;
   cloudRevision=r;cloudLastSynced=serialized;localStorage.setItem(accountBaseKey(ownerId),String(r));
   if(cloudSnapshot()===serialized){cloudDirty=false;clearCloudPending();cloudStatus('✓ All changes saved · Cloud revision '+r)}
   else{cloudDirty=true;markCloudPending();cloudStatus('✓ Saved locally · More changes pending…')}
  }catch(e){
   if(cloudSessionGeneration!==generation||cloudUser?.id!==ownerId)return;
   cloudReady=false;cloudDirty=true;markCloudPending();
   cloudStatus('Cloud upload paused; local work preserved: '+e.message);
   console.error('Cloud upload failed',e);
  }finally{cloudBusy=false;if(cloudReady&&cloudDirty)cloudSchedule()}
 }
 async function cloudAutoLoad(){
 if(!cloudClient||!cloudUser||cloudReady||cloudAutoLoading)return;
 cloudAutoLoading=true;const id=cloudUser.id,generation=cloudSessionGeneration;
 try{
  const row=await cloudFetch();
  if(cloudSessionGeneration!==generation||cloudUser?.id!==id)return;
  const draft=readAccountDraft(id),pending=localStorage.getItem(accountPendingKey(id))==='1';
  if(row&&!Array.isArray(row.content?.projects))throw Error('Invalid cloud project document');
  if(pending){
   data=draft||initial();render();
   const base=localStorage.getItem(accountBaseKey(id));
   if(row&&String(row.revision)!==String(base)){
    cloudReady=false;cloudDirty=true;
    cloudStatus('Sync conflict — cloud changed while this device had unsaved edits. Export JSON backup; no changes overwritten.');return;
   }
   cloudRevision=row?.revision??null;cloudLastSynced=row?JSON.stringify(row.content):null;
   cloudReady=true;cloudDirty=true;render();cloudStatus('Offline changes restored — synchronizing…');cloudSchedule(250);return;
  }
  if(row){
   data=row.content;cloudRevision=row.revision;cloudLastSynced=cloudSnapshot();cloudReady=true;cloudDirty=false;
   localStorage.setItem(accountDataKey(id),JSON.stringify(data));localStorage.setItem(accountBaseKey(id),String(row.revision));
   clearCloudPending();cloudStopTimers();current=null;view='home';render();
   cloudStatus('✓ Projects loaded automatically · Cloud revision '+row.revision);return;
  }
  // A new account starts empty; legacy device data is never silently uploaded to it.
  data=initial();cloudRevision=null;cloudLastSynced=cloudSnapshot();cloudReady=true;cloudDirty=false;
  localStorage.setItem(accountDataKey(id),JSON.stringify(data));render();
  cloudStatus('✓ New cloud library ready · Changes will save automatically');
 }catch(e){
  if(cloudSessionGeneration===generation&&cloudUser?.id===id){
   if(readAccountDraft(id)){restoreAccountDraft(id);cloudStatus('Offline — saved device copy available. Export JSON backup if needed. '+e.message)}
   else cloudStatus('Cloud unavailable — unable to load projects: '+e.message);
  }
  console.error('Automatic cloud load failed',e);
 }finally{cloudAutoLoading=false}
}
 async function cloudSyncNow(){
  if(!cloudClient){cloudStatus('Cloud connection unavailable. Your local projects are safe.');return}
  if(!cloudUser){cloudStatus('Sign in first. Your local projects are safe.');return}
  if(cloudBusy){cloudStatus('Cloud upload already in progress…');return}
  try{
   flushEditor();
   if(!cloudReady){
    cloudStatus('Checking cloud before starting sync…');
    const row=await cloudFetch();
    if(row){cloudStatus('Cloud library exists (revision '+row.revision+'). Sync is not initialized on this device. Export your local JSON backup, then use Download cloud projects. Local changes have NOT been uploaded.');}
    else{cloudStatus('No cloud library exists. Use Upload this device’s projects to initialize sync.');}
    return;
   }
   if(cloudDirty||cloudPending()){await cloudPush();return}
   cloudStatus('Checking for newer cloud changes…');
   const row=await cloudFetch();
   if(!row){cloudReady=false;cloudStatus('Cloud document is missing. Local work preserved.');return}
   if(row.revision!==cloudRevision){cloudReady=false;cloudDirty=true;cloudStatus('Cloud changed on another device (revision '+row.revision+'). Export local backup before downloading. Nothing overwritten.');}
   else cloudStatus('✓ All changes saved · Cloud revision '+cloudRevision);
  }catch(e){cloudStatus('Sync check failed: '+e.message);console.error('Cloud sync check failed',e)}
 }
window.addEventListener('focus',()=>{if(cloudReady)cloudSyncNow()});
window.addEventListener('offline',()=>{if(cloudUser)cloudStatus('Offline — changes saved on this device; export JSON backup if needed.')});
window.addEventListener('online',()=>{if(cloudReady){if(cloudDirty||cloudPending())cloudSchedule(250);else cloudSyncNow()}else if(cloudUser)cloudAutoLoad()});

const MEDIA_BUCKET='studio-media';
let mediaCategory='All files',mediaSearch='',mediaView='grid',mediaFolder='',mediaBusy=false;

let mediaObjectUrls=[];
function mediaClearUrls(){mediaObjectUrls.forEach(u=>URL.revokeObjectURL(u));mediaObjectUrls=[]}
function mediaAssets(p=project()){if(!p)return [];p.media??=[];return p.media}
function mediaFolders(p=project()){if(!p)return [];p.mediaFolders??=[];return p.mediaFolders}
function mediaType(f){let t=f.type||'';let n=(f.name||'').toLowerCase();if(t.startsWith('image/')||/\.(png|jpe?g|gif|webp|heic|svg|avif)$/.test(n))return 'Images';if(t.startsWith('audio/')||/\.(mp3|wav|m4a|aac|flac|ogg|opus)$/.test(n))return 'Audio';if(t.startsWith('video/')||/\.(mp4|mov|webm|m4v)$/.test(n))return 'Video';if(/pdf|text|word|document|spreadsheet|presentation/.test(t)||/\.(pdf|docx?|txt|md|rtf|xlsx?|pptx?)$/.test(n))return 'Documents';return 'Other'}
function mediaStatus(msg){let el=$('mediaStatus');if(el)el.textContent=msg;else toast(msg)}
function mediaPage(p){let assets=mediaAssets(p),folders=mediaFolders(p);let shown=assets.filter(a=>(!mediaFolder||a.folder===mediaFolder)&&(mediaCategory==='All files'||a.category===mediaCategory)&&(!mediaSearch||a.name.toLowerCase().includes(mediaSearch.toLowerCase())));let dirs=folders.filter(f=>!mediaFolder||f.parent===mediaFolder);return `<div class="top"><div><div class="eyebrow">Project files and creative references</div><h1 class="title">Media Library</h1><p class="sub">Images, audio, video, documents and more. Files are private to your account.</p></div></div>
<div class="media-bar"><button class="btn primary" onclick="mediaChoose()">＋ Upload files</button><button class="btn" onclick="mediaStartRecording()">🎙 Record voice note</button><button class="btn" onclick="mediaCreateFolder()">＋ New folder</button><button class="btn" onclick="mediaView=mediaView==='grid'?'list':'grid';render()">${mediaView==='grid'?'☷ List view':'▦ Grid view'}</button></div>
<div class="media-drop" id="mediaDrop" tabindex="0" ondragover="mediaDrag(event)" ondragleave="this.classList.remove('over')" ondrop="mediaDrop(event)" onpaste="mediaPaste(event)"><strong>Drop files here, paste an image, or choose files</strong><div class="media-hint">Multiple files supported · Ctrl/⌘ + V · On iPhone use Upload files or Record voice note</div><button class="btn" onclick="mediaChoose()">Browse device</button></div>
<input id="mediaInput" type="file" multiple style="display:none" onchange="mediaUpload(this.files)">
<div class="media-bar"><button class="btn" onclick="mediaFolder='';render()">⌂ All folders</button>${mediaFolder?`<span class="chip">${esc(folders.find(f=>f.id===mediaFolder)?.name||'Folder')}</span>`:''}<select aria-label="File type" onchange="mediaCategory=this.value;render()">${['All files','Images','Audio','Video','Documents','Other'].map(t=>`<option ${mediaCategory===t?'selected':''}>${t}</option>`).join('')}</select><input id="mediaSearch" aria-label="Search files" placeholder="Search files…" value="${esc(mediaSearch)}" oninput="mediaSearch=this.value;mediaFilterDOM()"></div>
<div id="mediaStatus" class="media-toast" role="status"></div><div id="mediaItems" class="${mediaView==='list'?'media-list':'media-grid'}">
${dirs.map(f=>`<div class="media-item"><div style="font-size:35px">📁</div><div class="filename">${esc(f.name)}</div><button class="btn" onclick="mediaFolder='${f.id}';render()">Open</button> <button class="btn" onclick="mediaRenameFolder('${f.id}')">Rename</button></div>`).join('')}
${shown.map(a=>mediaItemHTML(a)).join('')||'<p class="note">No files match this view. Upload something to begin.</p>'}</div>
<p class="media-hint">Files upload directly to private Supabase Storage. A working connection and the studio-media storage bucket are required. Recordings are saved when you stop and confirm.</p>`}
function mediaItemHTML(a){let id=esc(a.id),nm=esc(a.name);return `<div class="media-item" data-media-id="${id}"><div style="font-size:34px">${a.category==='Images'?'🖼️':a.category==='Audio'?'🎵':a.category==='Video'?'🎞️':a.category==='Documents'?'📄':'📦'}</div><div class="filename">${nm}</div><div class="media-hint">${esc(a.category)} · ${Math.round((a.size||0)/1024)} KB</div><div class="media-actions"><button class="btn" onclick="mediaOpen('${id}')">Preview / Open</button><button class="btn" onclick="mediaRename('${id}')">Rename</button><button class="btn" onclick="mediaMove('${id}')">Move</button><button class="btn danger" onclick="mediaDelete('${id}')">Delete</button></div></div>`}
function mediaFilterDOM(){let p=project();if(!p)return;let shown=mediaAssets(p).filter(a=>(!mediaFolder||a.folder===mediaFolder)&&(mediaCategory==='All files'||a.category===mediaCategory)&&(!mediaSearch||a.name.toLowerCase().includes(mediaSearch.toLowerCase())));let list=$('mediaItems');if(!list)return;list.querySelectorAll('[data-media-id]').forEach(el=>el.style.display=shown.some(a=>a.id===el.dataset.mediaId)?'':'none')}
function mediaChoose(){$('mediaInput')?.click()}
function mediaDrag(e){e.preventDefault();e.currentTarget.classList.add('over')}
function mediaDrop(e){e.preventDefault();e.currentTarget.classList.remove('over');if(e.dataTransfer?.files?.length)mediaUpload(e.dataTransfer.files)}
function mediaPaste(e){let files=[...(e.clipboardData?.files||[])];if(files.length){e.preventDefault();mediaUpload(files);return}let text=e.clipboardData?.getData('text/plain')||'';if(text.trim()){e.preventDefault();let f=new File([text],`Pasted note ${new Date().toISOString().slice(0,10)}.txt`,{type:'text/plain'});mediaUpload([f])}}
document.addEventListener('paste',e=>{if(view!=='media'||!cloudUser||!project())return;if(e.target.closest('input,textarea,[contenteditable]'))return;if(e.target.id==='mediaDrop')return;let files=[...(e.clipboardData?.files||[])];if(files.length){e.preventDefault();mediaUpload(files)}});
async function mediaUpload(fileList){if(mediaBusy)return mediaStatus('Wait for the current upload to finish');if(!cloudUser||!cloudClient||!cloudReady)return mediaStatus('Sign in and wait for cloud projects to load before uploading.');if(!navigator.onLine)return mediaStatus('Offline: file uploads require a connection. Save the file on your device and upload when online.');let files=[...fileList];if(!files.length)return;let owner=cloudUser.id,pr=project(),projectId=pr.id;mediaBusy=true;let done=0;try{for(const f of files){if(!cloudUser||cloudUser.id!==owner||project()?.id!==projectId)throw Error('Account or project changed during upload');if(f.size>50*1024*1024)throw Error(f.name+' exceeds the 50 MB per-file limit');mediaStatus(`Uploading ${done+1} of ${files.length}: ${f.name}`);let id=uid(),safe=(f.name||'file').replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,90),path=`${owner}/${projectId}/${id}-${safe}`;let {error}=await cloudClient.storage.from(MEDIA_BUCKET).upload(path,f,{contentType:f.type||'application/octet-stream',upsert:false});if(error)throw error;mediaAssets(pr).push({id,name:f.name||'Untitled',type:f.type||'',category:mediaType(f),size:f.size,path,folder:mediaFolder,createdAt:Date.now()});save();done++;}mediaStatus(`✓ Uploaded ${done} file${done===1?'':'s'} · Cloud project index syncing`);render();mediaStatus(`✓ Uploaded ${done} file${done===1?'':'s'}`)}catch(e){mediaStatus(`Upload stopped after ${done} file(s): ${e.message}. Check Settings and storage bucket permissions.`)}finally{mediaBusy=false;if($('mediaInput'))$('mediaInput').value=''}}
function mediaGet(id){return mediaAssets().find(a=>a.id===id)}
async function mediaSignedUrl(a){let {data:d,error}=await cloudClient.storage.from(MEDIA_BUCKET).createSignedUrl(a.path,3600);if(error)throw error;return d.signedUrl}
async function mediaOpen(id){let a=mediaGet(id);if(!a)return;try{let url=await mediaSignedUrl(a);let body=a.category==='Images'?`<img src="${esc(url)}" alt="${esc(a.name)}" style="max-width:100%;max-height:65vh;object-fit:contain">`:a.category==='Audio'?`<audio controls style="width:100%" src="${esc(url)}"></audio>`:a.category==='Video'?`<video controls style="width:100%;max-height:60vh" src="${esc(url)}"></video>`:`<p class="note">Preview this file in a new browser tab, or download it.</p>`;modal(`<h2>${esc(a.name)}</h2>${body}<div class="actions"><button class="btn primary" onclick="window.open('${esc(url)}','_blank','noopener')">Open / Download</button>${b('Close','closeModal()')}</div>`)}catch(e){mediaStatus('Could not open file: '+e.message)}}
function mediaRename(id){let a=mediaGet(id);if(!a)return;let n=prompt('File name',a.name);if(n?.trim()){a.name=n.trim();save();render()}}
function mediaMove(id){let a=mediaGet(id);if(!a)return;let folders=mediaFolders();let names=['(Root)',...folders.map(f=>f.name)];let choice=prompt('Move to folder (enter exact name):\n'+names.join('\n'),a.folder?folders.find(f=>f.id===a.folder)?.name:'(Root)');if(choice===null)return;let folder=choice==='(Root)'?'':folders.find(f=>f.name===choice)?.id;if(folder===undefined)return toast('Folder not found');a.folder=folder;save();render()}
async function mediaDelete(id){let a=mediaGet(id);if(!a||!confirm(`Delete ${a.name} from cloud storage? This cannot be undone.`))return;try{let {error}=await cloudClient.storage.from(MEDIA_BUCKET).remove([a.path]);if(error)throw error;let p=project();p.media=mediaAssets(p).filter(x=>x.id!==id);save();render()}catch(e){mediaStatus('Delete failed: '+e.message)}}
function mediaCreateFolder(){let name=prompt('New folder name');if(!name?.trim())return;mediaFolders().push({id:uid(),name:name.trim(),parent:mediaFolder});save();render()}
function mediaRenameFolder(id){let f=mediaFolders().find(x=>x.id===id);if(!f)return;let n=prompt('Rename folder',f.name);if(n?.trim()){f.name=n.trim();save();render()}}
async function mediaStartRecording(){if(!cloudUser||!cloudReady)return toast('Sign in and load your projects first');if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined')return mediaStatus('This browser does not support recording. Try Safari or Chrome over HTTPS.');try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});let formats=['audio/mp4','audio/webm;codecs=opus','audio/webm'];let mime=formats.find(t=>MediaRecorder.isTypeSupported(t));mediaChunks=[];mediaRecorder=new MediaRecorder(mediaStream,mime?{mimeType:mime}:undefined);mediaRecorder.ondataavailable=e=>{if(e.data.size)mediaChunks.push(e.data)};mediaRecorder.onstop=()=>{clearInterval(mediaTimer);mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;let blob=new Blob(mediaChunks,{type:mediaRecorder.mimeType||'audio/webm'});let ext=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';let u=URL.createObjectURL(blob);mediaObjectUrls.push(u);modal(`<h2>Voice note recorded</h2><audio controls src="${esc(u)}" style="width:100%"></audio>${field('recordName','Recording name',`Voice note ${new Date().toLocaleString()}.${ext}`)}<div class="actions">${b('Save to Media Library','mediaSaveRecording()','primary')}${b('Discard','mediaDiscardRecording()','danger')}</div>`);window._recordedBlob=blob};mediaRecorder.start();mediaStarted=Date.now();modal(`<h2>🎙 Recording voice note</h2><p class="recording" id="recordTimer">● Recording 0:00</p><p class="note">Keep this window open while recording. The microphone will stop when you press Stop.</p><div class="actions">${b('Stop recording','mediaStopRecording()','primary')}${b('Cancel','mediaCancelRecording()','danger')}</div>`);mediaTimer=setInterval(()=>{let el=$('recordTimer');if(el){let n=Math.floor((Date.now()-mediaStarted)/1000);el.textContent='● Recording '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}},500)}catch(e){mediaStream?.getTracks().forEach(t=>t.stop());mediaStatus('Microphone unavailable: '+e.message)}}

function mediaCancelRecording(){if(mediaRecorder){mediaRecorder.onstop=null;if(mediaRecorder.state==='recording')mediaRecorder.stop()}mediaStream?.getTracks().forEach(t=>t.stop());clearInterval(mediaTimer);closeModal()}
function mediaDiscardRecording(){window._recordedBlob=null;mediaClearUrls();closeModal()}

)}</div>`}
