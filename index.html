function renderNav(){

function loggedOutPage(){return `<div class="top"><div><div class="eyebrow">Your private creative workspace</div><h1 class="title">Welcome to Imagine</h1><p class="sub">Sign in to load your projects securely from the cloud.</p></div></div><div class="panel"><h2>Sign in to continue</h2><p class="note">Your work is hidden when you are signed out. Your session will be remembered on this device.</p><div class="actions">${b('Log in / Create account','showLoginDialog()','primary')}</div></div>${legacyBackupAvailable()?`<div class="panel"><h3>Previous device backup</h3><p class="note">Older Imagine versions saved a local library. It is preserved but not displayed while signed out. You may download a backup before migrating.</p>${b('Export previous local backup','exportLegacyBackup()','ghost')}</div>`:''}`}

function newProject(){modal(`<h2>Create a project</h2><p class="note">Film and Book are labels, not rigid templates. All tools are optional.</p>${field('pname','Project name')}${select('ptype','Project type',['Film','Book','Other'],'Film')}${field('pdesc','Short description (optional)')}<div class="row">${b('Create project','createProject()','primary')}${b('Cancel','closeModal()','ghost')}</div>`);$('pname').focus()}function createProject(){let name=$('pname').value.trim();if(!name)return toast('Enter a project name');let p={id:uid(),name,type:$('ptype').value,description:$('pdesc').value,colors:['#5745a2','#147d79'],sections:[],scenes:[],songs:[],characters:[],notes:[],ideas:[],writing:'',tools:{ideas:true,plotline:true,scenes:true,writing:true,songs:true,characters:true,notebook:true},createdAt:Date.now()};data.projects.push(p);closeModal();current=p.id;setView('overview');save()}function duplicateProject(id){let p=data.projects.find(x=>x.id===id);let copy=JSON.parse(JSON.stringify(p));copy.id=uid();const ids=new Map();for(const group of ['sections','scenes','songs','characters','notes','ideas'])for(const x of copy[group]||[]){const old=x.id;x.id=uid();ids.set(old,x.id)}for(const x of copy.sections||[])x.sceneIds=(x.sceneIds||[]).map(id=>ids.get(id)||id);for(const x of copy.ideas||[])if(x.sceneId)x.sceneId=ids.get(x.sceneId)||x.sceneId;for(const x of copy.scenes||[])x.songIds=(x.songIds||[]).map(id=>ids.get(id)||id);copy.name+=' (copy)';copy.createdAt=Date.now();data.projects.push(copy);persist();toast('Project duplicated')}
function overviewPage(p){let cards=[['ideas','✦','Idea Board','Collect and connect unfinished ideas'],['plotline','◇','Plotline','Shape your story, your way'],['scenes','▣','Scenes','Capture moments and ideas'],['writing','✎','Writing','Manuscript or screenplay'],['songs','♫','Music','Build your sonic palette'],['characters','♙','Characters','Develop your cast'],['notebook','✧','Notebook','Collect thoughts and direction']];return `<div class="top"><div><div class="eyebrow">${esc(p.type)} / Creative workspace</div><h1 class="title">${esc(p.name)}</h1><p class="sub">${esc(p.description||'An open canvas for your next story.')}</p></div>${b('⚙ Customize','setView(\'settings\')')}</div><div class="grid">${cards.filter(c=>p.tools[c[0]]!==false).map(([v,icon,t,d])=>`<div class="panel" style="cursor:pointer;min-height:145px" onclick="setView('${v}')"><div style="font-size:28px;color:var(--accent)">${icon}</div><h3 style="margin:8px 0 3px">${t}</h3><div class="small">${d}</div></div>`).join('')}</div><div class="panel"><div class="eyebrow">At a glance</div><h2>${p.scenes.length} scenes · ${p.songs.length} songs · ${(p.ideas||[]).length} ideas · ${p.notes.length} notes</h2><p class="note">Start anywhere. You don't need to establish a plotline before writing scenes. Your edits now save automatically as you type.</p></div>`}
function plotlinePage(p){let assigned=new Set(p.sections.flatMap(s=>s.sceneIds||[]));let loose=p.scenes.filter(s=>!assigned.has(s.id));return `<div class="top"><div><div class="eyebrow">Structure / Completely optional</div><h1 class="title">Plotline</h1><p class="sub">Create your own acts, chapters, arcs, or sections. Nothing is predefined.</p></div>${b('+ Add section','addSection()','primary')}</div><div class="panel"><div class="row"><strong>Story arrangement</strong><span class="chip">${p.sections.length} sections</span></div><p class="note">Use ↑ ↓ to reorder sections or scenes. Assign scenes to a section from the scene editor.</p></div>${p.sections.map((s,i)=>`<div class="section"><div class="row"><div><h3>${esc(s.name)}</h3><div class="small">${(s.sceneIds||[]).length} scenes</div></div><div class="actions">${b('↑',`moveSection('${s.id}',-1)`,'ghost')}${b('↓',`moveSection('${s.id}',1)`,'ghost')}${b('Rename',`renameSection('${s.id}')`,'ghost')}${b('×',`removeSection('${s.id}')`,'danger')}</div></div>${(s.sceneIds||[]).map((id,j)=>{let sc=p.scenes.find(x=>x.id===id);return sc?`<div class="scenechip"><span onclick="editScene('${id}')">${esc(sc.title)}</span><div class="actions">${b('↑',`moveSceneWithin('${s.id}','${id}',-1)`,'ghost')}${b('↓',`moveSceneWithin('${s.id}','${id}',1)`,'ghost')}</div></div>`:''}).join('')||'<p class="small">No scenes in this section yet</p>'}</div>`).join('')}${loose.length?`<div class="section"><h3>Unassigned scenes</h3><p class="small">Ideas that haven't found a place in the plotline yet.</p>${loose.map(s=>`<div class="scenechip" onclick="editScene('${s.id}')">${esc(s.title)} →</div>`).join('')}</div>`:''}${!p.sections.length&&!loose.length?blank('A blank plotline','Add sections when you are ready—or create scenes first.'):''}`}
function addSection(){modal(`<h2>New plotline section</h2>${field('secname','Section title','','text')}<p class="note">Examples: Act One, Chapter 3, The Reunion, or anything you invent.</p><div class="row">${b('Add section','createSection()','primary')}${b('Cancel','closeModal()')}</div>`)}function createSection(){let n=$('secname').value.trim();if(!n)return;project().sections.push({id:uid(),name:n,sceneIds:[]});closeModal();persist()}function renameSection(id){let s=project().sections.find(x=>x.id===id);modal(`<h2>Rename section</h2>${field('secname','Title',s.name)}${b('Save',`saveSectionName('${id}')`,'primary')} ${b('Cancel','closeModal()')}`)}function saveSectionName(id){let n=$('secname').value.trim();if(n)project().sections.find(s=>s.id===id).name=n;closeModal();persist()}function removeSection(id){if(!confirm('Remove this section? Its scenes will remain in your project as unassigned scenes.'))return;project().sections=project().sections.filter(s=>s.id!==id);persist()}function moveSection(id,d){let a=project().sections,i=a.findIndex(s=>s.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];persist()}function moveSceneWithin(sid,id,d){let a=project().sections.find(s=>s.id===sid).sceneIds,i=a.indexOf(id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];persist()}
function scenesPage(p){return `<div class="top"><div><div class="eyebrow">Story building</div><h1 class="title">Scenes</h1><p class="sub">Capture fragments, develop them, and connect them to the larger story.</p></div>${b('+ New scene','newScene()','primary')}</div><div class="two"><div class="panel"><div class="eyebrow">Scene library</div><div class="stack" style="margin-top:12px">${p.scenes.map(s=>`<div class="item ${activeScene===s.id?'selected':''}" onclick="editScene('${s.id}')"><h3>${esc(s.title)}</h3><div class="small">${esc(s.summary||'No description yet')}</div></div>`).join('')||blank('No scenes yet','Add your first moment.')}</div></div><div class="panel">${activeScene?sceneEditor(p):blank('Choose a scene','Select a scene on the left, or create a new one.')}</div></div>`}
function newScene(){flushEditor();let s={id:uid(),title:'Untitled scene',summary:'',story:'',direction:'',script:'',songIds:[],characterIds:[]};project().scenes.push(s);activeScene=s.id;sceneTab='story';view='scenes';save();render()}function editScene(id){flushEditor();activeScene=id;view='scenes';sceneTab='story';render()}function sceneEditor(p){let s=p.scenes.find(x=>x.id===activeScene);if(!s)return '';let sect=p.sections.find(x=>(x.sceneIds||[]).includes(s.id));return `<div class="row"><h2 style="margin:0">Scene editor</h2>${b('Delete scene',`deleteScene('${s.id}')`,'danger')}</div>${field('sceneTitle','Scene title',s.title)}${field('sceneSummary','One-line summary',s.summary)}<div class="field"><label>Plotline section (optional)</label><select id="sceneSection"><option value="">Unassigned</option>${p.sections.map(x=>`<option value="${x.id}" ${sect?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="tabbar">${[['story','Story'],['direction','Direction / imagery'],['script','Written scene'],['music','Linked songs']].map(([v,t])=>`<button class="${sceneTab===v?'active':''}" onclick="changeSceneTab('${v}')">${t}</button>`).join('')}</div>${sceneTab==='music'?`<div class="field"><label>Associated songs</label>${p.songs.length?p.songs.map(x=>`<label style="display:block;margin:8px 0"><input type="checkbox" class="songLink" value="${x.id}" ${(s.songIds||[]).includes(x.id)?'checked':''}> ${esc(x.title)} — ${esc(x.artist)}</label>`).join(''):'<p class="note">Add songs in the Music module first.</p>'}</div>`:field('sceneBody',sceneTab==='story'?'What happens?':sceneTab==='direction'?'Visual and directorial notes':'Manuscript or screenplay passage',s[sceneTab==='story'?'story':sceneTab==='direction'?'direction':'script'],'textarea')}<div class="row">${b('Save scene',`saveScene('${s.id}')`,'primary')}<span class="small">Changes are stored locally</span></div>`}
function changeSceneTab(tab){flushEditor();sceneTab=tab;render()}function saveScene(id,redraw=true){let p=project(),s=p.scenes.find(x=>x.id===id);if(!s)return;s.title=$('sceneTitle')?.value||s.title;s.summary=$('sceneSummary')?.value||'';let key=sceneTab==='story'?'story':sceneTab==='direction'?'direction':'script';if(sceneTab==='music')s.songIds=[...document.querySelectorAll('.songLink:checked')].map(x=>x.value);else s[key]=$('sceneBody')?.value||'';let secId=$('sceneSection')?.value||'';p.sections.forEach(x=>x.sceneIds=x.sceneIds.filter(i=>i!==id));if(secId)p.sections.find(x=>x.id===secId)?.sceneIds.push(id);save();if(redraw){render();toast('Scene saved')}}function deleteScene(id){if(!confirm('Delete this scene?'))return;let p=project();p.scenes=p.scenes.filter(s=>s.id!==id);p.sections.forEach(s=>s.sceneIds=s.sceneIds.filter(x=>x!==id));activeScene=null;persist()}
function writingPage(p){return `<div class="top"><div><div class="eyebrow">Long-form writing</div><h1 class="title">Writing</h1><p class="sub">A freeform writing space, alongside passages saved in individual scenes.</p></div>${b('Save writing','saveWriting()','primary')}</div><div class="panel">${field('writingBody','Project manuscript / screenplay',p.writing||'','textarea')}<p class="note">Scene-specific writing stays in the scene editor. This is an additional project-wide document.</p></div><div class="panel"><h3>Scene passages</h3>${p.scenes.filter(s=>s.script?.trim()).map(s=>`<div class="section"><strong>${esc(s.title)}</strong><p style="white-space:pre-wrap">${esc(s.script)}</p></div>`).join('')||'<p class="note">No scene passages yet.</p>'}</div>`}function saveWriting(){project().writing=$('writingBody').value;save();toast('Writing saved')}
function songsPage(p){return `<div class="top"><div><div class="eyebrow">Music and inspiration</div><h1 class="title">Music</h1><p class="sub">Build a soundtrack or simply collect the songs that spark ideas.</p></div>${b('+ Add song','newSong()','primary')}</div><div class="two"><div class="panel"><div class="stack">${p.songs.map(s=>`<div class="item ${activeSong===s.id?'selected':''}" onclick="editSong('${s.id}')"><h3>♫ ${esc(s.title)}</h3><div class="small">${esc(s.artist)}</div></div>`).join('')||blank('No songs yet','Add a song to your project.')}</div></div><div class="panel">${activeSong?songEditor(p):blank('Song notes','Select a song to capture its imagery, emotion, or story ideas.')}</div></div>`}function newSong(){let s={id:uid(),title:'Untitled song',artist:'',url:'',notes:''};project().songs.push(s);activeSong=s.id;persist()}function editSong(id){flushEditor();activeSong=id;render()}function songEditor(p){let s=p.songs.find(x=>x.id===activeSong);return `<h2>Song details</h2>${field('songTitle','Title',s.title)}${field('songArtist','Artist',s.artist)}${field('songUrl','Spotify / reference URL',s.url)}${field('songNotes','Images, emotions, interpretations',s.notes,'textarea')}<div class="row">${b('Save song',`saveSong('${s.id}')`,'primary')}${b('Delete',`deleteSong('${s.id}')`,'danger')}</div>`}function saveSong(id){let s=project().songs.find(x=>x.id===id);s.title=$('songTitle').value;s.artist=$('songArtist').value;s.url=$('songUrl').value;s.notes=$('songNotes').value;persist();toast('Song saved')}function deleteSong(id){if(!confirm('Delete song?'))return;let p=project();p.songs=p.songs.filter(x=>x.id!==id);p.scenes.forEach(s=>s.songIds=s.songIds.filter(x=>x!==id));activeSong=null;persist()}
function charactersPage(p){return `<div class="top"><div><div class="eyebrow">People and perspectives</div><h1 class="title">Characters</h1><p class="sub">Develop characters, motivations, contradictions, and arcs.</p></div>${b('+ Add character','newCharacter()','primary')}</div><div class="two"><div class="panel"><div class="stack">${p.characters.map(c=>`<div class="item ${activeCharacter===c.id?'selected':''}" onclick="flushEditor();activeCharacter='${c.id}';render()"><h3>${esc(c.name)}</h3><div class="small">${esc(c.role)}</div></div>`).join('')||blank('No characters yet','Start with a name or an idea.')}</div></div><div class="panel">${activeCharacter?characterEditor(p):blank('Character profile','Select a character to edit.')}</div></div>`}function newCharacter(){flushEditor();let c={id:uid(),name:'',role:'',notes:''};project().characters.push(c);activeCharacter=c.id;save();render()}function copyCharacter(id){flushEditor();let original=project().characters.find(c=>c.id===id);if(!original)return;let copy={...structuredClone(original),id:uid(),name:(original.name||'Unnamed character')+' (copy)'};project().characters.push(copy);activeCharacter=copy.id;save();render();toast('Character copied — edit the new profile independently')}function characterEditor(p){let c=p.characters.find(x=>x.id===activeCharacter);return `<h2>Character profile</h2>${field('charName','Name',c.name)}${field('charRole','Role / relationship',c.role)}${field('charNotes','Background, motivation, arc',c.notes,'textarea')}<div class="row">${b('Save',`saveCharacter('${c.id}')`,'primary')}${b('Copy character',`copyCharacter('${c.id}')`)}${b('Delete',`deleteCharacter('${c.id}')`,'danger')}</div>`}function saveCharacter(id){let c=project().characters.find(x=>x.id===id);c.name=$('charName').value;c.role=$('charRole').value;c.notes=$('charNotes').value;persist()}function deleteCharacter(id){if(!confirm('Delete character?'))return;project().characters=project().characters.filter(x=>x.id!==id);activeCharacter=null;persist()}
function notebookPage(p){return `<div class="top"><div><div class="eyebrow">Creative fragments</div><h1 class="title">Notebook</h1><p class="sub">A home for ideas that aren't ready to become scenes.</p></div>${b('+ New note','newNote()','primary')}</div><div class="two"><div class="panel"><div class="stack">${p.notes.map(n=>`<div class="item ${activeNote===n.id?'selected':''}" onclick="flushEditor();activeNote='${n.id}';render()"><h3>${esc(n.title)}</h3><div class="small">${esc(n.body.slice(0,100))}</div></div>`).join('')||blank('No notes yet','Capture an idea, however unfinished.')}</div></div><div class="panel">${activeNote?noteEditor(p):blank('Notebook','Select or create a note.')}</div></div>`}function newNote(){let n={id:uid(),title:'Untitled note',body:''};project().notes.push(n);activeNote=n.id;persist()}function noteEditor(p){let n=p.notes.find(x=>x.id===activeNote);return `<h2>Notebook entry</h2>${field('noteTitle','Title',n.title)}${field('noteBody','Note',n.body,'textarea')}<div class="row">${b('Save',`saveNote('${n.id}')`,'primary')}${b('Delete',`deleteNote('${n.id}')`,'danger')}</div>`}function saveNote(id){let n=project().notes.find(x=>x.id===id);n.title=$('noteTitle').value;n.body=$('noteBody').value;persist()}function deleteNote(id){if(!confirm('Delete note?'))return;project().notes=project().notes.filter(x=>x.id!==id);activeNote=null;persist()}
const IDEA_TYPES=['Thought','Scene seed','Dialogue','Visual','Music','Character','Research'];const IDEA_COLORS=['#334e78','#5b3a76','#275b62','#684a37','#4d6250','#6a3657'];
function ideasPage(p){p.ideas??=[];let cards=p.ideas.filter(x=>(ideaFilter==='All'||x.type===ideaFilter)&&(!ideaQuery||[x.title,x.body,x.type].join(' ').toLowerCase().includes(ideaQuery.toLowerCase())));return `<div class="top"><div><div class="eyebrow">Creative playground / No structure required</div><h1 class="title">Idea Board <span class="tagline">✦</span></h1><p class="sub">Collect fragments. Move them around. Turn an idea into a scene when it feels ready.</p></div>${b('+ Capture idea','newIdea()','primary')}</div><div class="idea-toolbar"><input class="idea-search" aria-label="Search ideas" placeholder="Search your ideas…" value="${esc(ideaQuery)}" oninput="ideaQuery=this.value;refreshIdeas()"><select class="idea-search" aria-label="Filter idea type" onchange="ideaFilter=this.value;refreshIdeas()"><option>All</option>${IDEA_TYPES.map(t=>`<option ${ideaFilter===t?'selected':''}>${t}</option>`).join('')}</select>${b('Reset filters','resetIdeaFilters()','ghost')}<span class="chip">${cards.length} / ${p.ideas.length} ideas</span></div><div class="idea-board" id="ideaBoard">${cards.map(x=>`<article class="idea-card" draggable="true" data-id="${x.id}" style="--idea-color:${IDEA_COLORS.includes(x.color)?x.color:IDEA_COLORS[0]}" ondragstart="ideaDragStart(event,'${x.id}')" ondragover="ideaDragOver(event,'${x.id}')" ondragleave="this.classList.remove('over')" ondrop="ideaDrop(event,'${x.id}')" ondragend="ideaDragEnd()"><div class="row"><span class="idea-type">${esc(x.type)}</span><button onclick="editIdea('${x.id}')" title="Edit idea">✎ Edit</button></div><h3>${esc(x.title||'Untitled idea')}</h3><p>${esc((x.body||'').slice(0,300))}${(x.body||'').length>300?'…':''}</p><div class="idea-bottom"><span class="idea-preview">${x.sceneId?'Linked to scene':'Unassigned idea'}</span><button onclick="makeSceneFromIdea('${x.id}')" title="Create a new scene from this idea">↗ Scene</button></div></article>`).join('')}<div class="idea-drop" ondragover="event.preventDefault()" ondrop="ideaDrop(event,null)" onclick="newIdea()">＋ Add another idea</div></div><p class="note">Drag cards to change their order. Your ideas are saved automatically on this device. Creating a scene keeps the original idea.</p>`}
function refreshIdeas(){
 // Only replace search results, never the focused search input or its toolbar.
 // Rebuilding #app on each keystroke interrupts typing and IME composition.
 const p=project(),board=$('ideaBoard');
 if(!p||!board)return;
 const template=document.createElement('template');
 template.innerHTML=ideasPage(p);
 const updatedBoard=template.content.querySelector('#ideaBoard');
 if(updatedBoard)board.innerHTML=updatedBoard.innerHTML;
 const updatedCount=template.content.querySelector('.idea-toolbar .chip');
 const currentCount=document.querySelector('#app .idea-toolbar .chip');
 if(updatedCount&&currentCount)currentCount.textContent=updatedCount.textContent;
}

function newIdea(){editIdea(null)}

// Spotify: Authorization Code with PKCE. No Spotify password or client secret is stored.
const SPOTIFY_CLIENT_ID='61a68ef1a195466cae17b976fec8799d';const SPOTIFY_TOKEN_KEY='imagine-spotify-session';
let spotifyToken=null,spotifyProfile=null,spotifyResults=[];
function spotifyClientId(){return SPOTIFY_CLIENT_ID}
function spotifyReadToken(){try{let t=JSON.parse(sessionStorage.getItem(SPOTIFY_TOKEN_KEY)||'null');return t?.expires>Date.now()?t:null}catch{return null}}
spotifyToken=spotifyReadToken();
function spotifyConnected(){return !!spotifyToken?.access_token&&spotifyToken.expires>Date.now()}
function spotifyRandom(n){let bytes=new Uint8Array(n);crypto.getRandomValues(bytes);return Array.from(bytes,b=>String.fromCharCode(b)).join('')}
function spotifyBase64Url(bytes){return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function spotifyConnect(){if(location.protocol!=='https:')return toast('Open Imagine on HTTPS to connect Spotify');let verifier=spotifyBase64Url(new TextEncoder().encode(spotifyRandom(48)));let digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));let state=spotifyBase64Url(new TextEncoder().encode(spotifyRandom(20)));sessionStorage.setItem('imagine-spotify-pkce',JSON.stringify({verifier,state,created:Date.now()}));let q=new URLSearchParams({response_type:'code',client_id:spotifyClientId(),scope:'user-read-private playlist-read-private playlist-read-collaborative streaming user-read-playback-state user-modify-playback-state',redirect_uri:location.origin+location.pathname,code_challenge_method:'S256',code_challenge:spotifyBase64Url(digest),state});location.href='https://accounts.spotify.com/authorize?'+q}
async function spotifyHandleRedirect(){let q=new URLSearchParams(location.search);if(!q.has('code')&&!q.has('error'))return;let pkce;try{pkce=JSON.parse(sessionStorage.getItem('imagine-spotify-pkce')||'null')}catch{};history.replaceState({},'',location.pathname+location.hash);if(q.has('error'))return toast('Spotify authorization: '+q.get('error'));if(!pkce||pkce.state!==q.get('state')||Date.now()-pkce.created>10*60*1000)return toast('Spotify authorization expired. Try connecting again.');sessionStorage.removeItem('imagine-spotify-pkce');try{let body=new URLSearchParams({client_id:spotifyClientId(),grant_type:'authorization_code',code:q.get('code'),redirect_uri:location.origin+location.pathname,code_verifier:pkce.verifier});let r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});let t=await r.json();if(!r.ok)throw Error(t.error_description||t.error||'Token exchange failed');spotifyToken={access_token:t.access_token,expires:Date.now()+t.expires_in*1000};sessionStorage.setItem(SPOTIFY_TOKEN_KEY,JSON.stringify(spotifyToken));toast('Spotify connected');render()}catch(e){toast('Spotify connection failed: '+e.message)}}
function spotifyDisconnect(){spotifyToken=null;spotifyProfile=null;sessionStorage.removeItem(SPOTIFY_TOKEN_KEY);render()}
async function spotifyFetch(path){if(!spotifyConnected())throw Error('Connect Spotify again');let r=await fetch('https://api.spotify.com/v1/'+path,{headers:{Authorization:'Bearer '+spotifyToken.access_token}});if(r.status===401){spotifyDisconnect();throw Error('Spotify session expired. Reconnect.')}if(!r.ok){let detail='';try{let body=await r.json();detail=body?.error?.message||body?.error_description||''}catch(_){}throw Error('Spotify API error '+r.status+(detail?': '+detail:''))}return r.json()}
async function spotifySearch(){let term=$('spotifyQuery')?.value.trim();if(!term)return;let status=$('spotifySearchStatus');if(status)status.textContent='Searching Spotify…';try{let r=await spotifyFetch('search?'+new URLSearchParams({q:term,type:'track',limit:'10'}));spotifyResults=r.tracks?.items||[];let el=$('spotifyResults');if(el)el.innerHTML=spotifyResults.map((t,i)=>`<div class="spotify-result">${t.album?.images?.[0]?.url?`<img src="${esc(t.album.images[0].url)}" alt="Album cover">`:''}<div class="result-info"><strong>${esc(t.name)}</strong><small>${esc(t.artists?.map(a=>a.name).join(', ')||'')} · ${esc(t.album?.name||'')}</small></div><button class="btn" onclick="spotifyImport(${i})">＋ Add</button></div>`).join('')||'<p class="note">No matching songs.</p>';if(status)status.textContent=spotifyResults.length+' results'}catch(e){if(status)status.textContent=e.message}}
function spotifyImport(i){let t=spotifyResults[i],p=project();if(!t||!p)return;if(p.songs.some(s=>s.spotifyId===t.id))return toast('Already in this project');p.songs.push({id:uid(),title:t.name,artist:t.artists?.map(a=>a.name).join(', ')||'',url:t.external_urls?.spotify||'',spotifyId:t.id,album:t.album?.name||'',artwork:t.album?.images?.[0]?.url||'',notes:''});save();render();toast('Added '+t.name)}

// V7.8.5 — Spotify Web Playback SDK mini-player.

function imagineFormatTime(ms){if(!Number.isFinite(ms))return '0:00';let sec=Math.floor(Math.max(0,ms)/1000);return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')}
function imagineSongId(song){return song?.spotifyId||song?.url?.match(/open\.spotify\.com\/track\/([a-zA-Z0-9]+)/)?.[1]||null}
function imagineLoadSdk(){
 if(window.Spotify?.Player)return Promise.resolve();
 if(imagineSdkPromise)return imagineSdkPromise;
 imagineSdkPromise=new Promise((resolve,reject)=>{
  const prior=window.onSpotifyWebPlaybackSDKReady;
  window.onSpotifyWebPlaybackSDKReady=()=>{if(typeof prior==='function')prior();resolve()};
  const tag=document.createElement('script');tag.src='https://sdk.scdn.co/spotify-player.js';
  tag.onerror=()=>reject(Error('Could not load Spotify player SDK'));document.head.appendChild(tag);
 });
 return imagineSdkPromise;
}
async function imagineEnsurePlayer(){
 if(!spotifyConnected())throw Error('Connect Spotify to use playback');
 if(imaginePlayerReady&&imagineDevice)return imagineDevice;
 await imagineLoadSdk();
 if(!imaginePlayer){
  imaginePlayer=new Spotify.Player({name:'Imagine Music Player',getOAuthToken:cb=>cb(spotifyToken?.access_token||''),volume:.65});
  imaginePlayer.addListener('ready',({device_id})=>{imagineDevice=device_id;imaginePlayerReady=true;imaginePlayerError='';imagineUpdatePlayer()});
  imaginePlayer.addListener('not_ready',()=>{imaginePlayerReady=false;imagineDevice=null;imagineUpdatePlayer()});
  imaginePlayer.addListener('player_state_changed',state=>{imaginePlayerState=state;imagineUpdatePlayer()});
  for(const name of ['initialization_error','authentication_error','account_error','playback_error']){
   imaginePlayer.addListener(name,({message})=>{imaginePlayerError=message||name;imagineUpdatePlayer();toast('Spotify player: '+imaginePlayerError)});
  }
  imaginePlayer.addListener('autoplay_failed',()=>{imaginePlayerError='Press Play to allow browser audio';imagineUpdatePlayer()});
  const ok=await imaginePlayer.connect();
  if(!ok)throw Error('Spotify playback device could not connect');
 }
 for(let i=0;i<35&&!imagineDevice;i++)await new Promise(r=>setTimeout(r,100));
 if(!imagineDevice)throw Error(imaginePlayerError||'Spotify playback device is not ready');
 return imagineDevice;
}
async function imaginePlayerApi(path,method='PUT',body){
 const r=await fetch('https://api.spotify.com/v1/me/player/'+path,{
  method,headers:{Authorization:'Bearer '+spotifyToken.access_token,...(body?{'Content-Type':'application/json'}:{})},
  ...(body?{body:JSON.stringify(body)}:{})
 });
 if(!r.ok){let d='';try{let x=await r.json();d=x?.error?.message||''}catch{}throw Error('Spotify playback '+r.status+(d?': '+d:''))}
}
async function imaginePlaySong(id){
 try{
  const p=project(),song=p?.songs?.find(s=>s.id===id);
  if(!song)throw Error('Song not found');
  const track=imagineSongId(song);
  if(!track)throw Error('This song needs a Spotify track link to play');
  imaginePlayingSong=song;imagineUpdatePlayer();
  // A user gesture activates audio on mobile Safari and other restricted browsers.
  if(imaginePlayer)imaginePlayer.activateElement();
  const device=await imagineEnsurePlayer();
  await imaginePlayer.activateElement();
  await imaginePlayerApi('play?device_id='+encodeURIComponent(device),'PUT',{uris:['spotify:track:'+track]});
  imaginePlayerError='';imagineUpdatePlayer();
 }catch(e){imaginePlayerError=e.message;imagineUpdatePlayer();toast(e.message)}
}
async function imaginePlayerAction(action){
 try{
  if(!imaginePlayerReady)await imagineEnsurePlayer();
  await imaginePlayer.activateElement();
  if(action==='toggle'){
   if(!imaginePlayerState&&imaginePlayingSong)return imaginePlaySong(imaginePlayingSong.id);
   await imaginePlayer.togglePlay();
  }else if(action==='stop'){await imaginePlayer.pause();await imaginePlayer.seek(0)}
  else if(action==='next')await imaginePlayer.nextTrack();
  else if(action==='previous')await imaginePlayer.previousTrack();
  imaginePlayerError='';imagineUpdatePlayer();
 }catch(e){imaginePlayerError=e.message;imagineUpdatePlayer();toast(e.message)}
}
async function imagineSeek(value){
 try{await imaginePlayer.seek(Number(value));imagineUpdatePlayer()}catch(e){toast(e.message)}
}
function imagineUpdatePlayer(){
 let el=document.getElementById('imagineMiniPlayer');
 if(!spotifyConnected()){el?.remove();document.body.classList.remove('imagine-has-player');return}
 if(!el){el=document.createElement('div');el.id='imagineMiniPlayer';document.body.appendChild(el)}
 document.body.classList.add('imagine-has-player');
 const state=imaginePlayerState,track=state?.track_window?.current_track;
 const song=imaginePlayingSong;
 const title=track?.name||song?.title||'Ready to play';
 const artist=track?.artists?.map(x=>x.name).join(', ')||song?.artist||'Select a song in Imagine';
 const cover=track?.album?.images?.[0]?.url||song?.artwork||'';
 const duration=state?.duration||track?.duration_ms||0,position=state?.position||0;
 el.innerHTML=`<div class="imagine-player-inner">
  <div class="imagine-player-info">${cover?`<img class="imagine-player-cover" src="${esc(cover)}" alt="Album art">`:'<div class="imagine-player-cover"></div>'}
  <div style="min-width:0"><div class="imagine-player-title">${esc(title)}</div><div class="imagine-player-artist">${esc(artist)}</div></div></div>
  <div class="imagine-player-controls">
   <button aria-label="Previous" title="Previous" onclick="imaginePlayerAction('previous')">⏮</button>
   <button class="main-play" aria-label="${state&&!state.paused?'Pause':'Play'}" title="${state&&!state.paused?'Pause':'Play'}" onclick="imaginePlayerAction('toggle')">${state&&!state.paused?'Ⅱ':'▶'}</button>
   <button aria-label="Stop" title="Stop and rewind" onclick="imaginePlayerAction('stop')">■</button>
   <button aria-label="Next" title="Next" onclick="imaginePlayerAction('next')">⏭</button>
  </div>
  <div class="imagine-player-progress"><span>${imagineFormatTime(position)}</span><input aria-label="Song position" type="range" min="0" max="${duration||1}" value="${position}" onchange="imagineSeek(this.value)" ${duration?'':'disabled'}><span>${imagineFormatTime(duration)}</span></div>
  <div class="imagine-player-status">${esc(imaginePlayerError||(!imaginePlayerReady?'Spotify Premium playback · select a song':'Imagine Spotify player'))}</div>
 </div>`;
}
