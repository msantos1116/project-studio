'use strict';const KEY='project-studio-v2';const uid=()=>crypto.randomUUID?.()||String(Date.now())+Math.random().toString(36).slice(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initial=()=>({version:2,projects:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial();if(!Array.isArray(data.projects))throw Error()}catch{data=initial()}let current=null,view='home',activeScene=null,activeSong=null,activeNote=null,activeCharacter=null,sceneTab='story',ideaFilter='All',ideaQuery='';const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(KEY,JSON.stringify(data));$('saveStatus').textContent='✓ Saved locally';cloudQueue()}catch(e){$('saveStatus').textContent='Storage full — export backup';toast('Could not save. Export your project now.')}}function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>$('toast').style.display='none',2500)}function project(){return data.projects.find(p=>p.id===current)}function persist(){flushEditor();save();render()}function b(label,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}function blank(label,desc){return `<div class="empty"><strong>${esc(label)}</strong><p>${esc(desc)}</p></div>`}function field(id,label,value='',type='text'){return `<div class="field"><label for="${id}">${esc(label)}</label>${type==='textarea'?`<textarea id="${id}">${esc(value)}</textarea>`:`<input id="${id}" type="${type}" value="${esc(value)}">`}</div>`}function select(id,label,options,value){return `<div class="field"><label>${esc(label)}</label><select id="${id}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}function modal(html){$('modalRoot').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}function closeModal(){$('modalRoot').innerHTML=''}function setView(v){flushEditor();view=v;activeScene=null;activeSong=null;activeNote=null;activeCharacter=null;render()}function goHome(){flushEditor();current=null;setView('home')}function openProject(id){flushEditor();current=id;setView('overview')}let autosaveTimer;function queueAutosave(){clearTimeout(autosaveTimer);$('saveStatus').textContent='Saving…';autosaveTimer=setTimeout(flushEditor,450)}
function flushEditor(){clearTimeout(autosaveTimer);if(!current)return;let p=project();if(!p)return;const val=id=>$(id)?.value;
if(view==='scenes'&&activeScene){let s=p.scenes.find(x=>x.id===activeScene);if(s){if(val('sceneTitle')!==undefined)s.title=val('sceneTitle');if(val('sceneSummary')!==undefined)s.summary=val('sceneSummary');if(sceneTab==='music')s.songIds=[...document.querySelectorAll('.songLink:checked')].map(x=>x.value);else if(val('sceneBody')!==undefined)s[sceneTab==='story'?'story':sceneTab==='direction'?'direction':'script']=val('sceneBody');if($('sceneSection')){let secId=val('sceneSection');p.sections.forEach(x=>x.sceneIds=x.sceneIds.filter(i=>i!==s.id));if(secId)p.sections.find(x=>x.id===secId)?.sceneIds.push(s.id)}}}
if(view==='songs'&&activeSong){let x=p.songs.find(x=>x.id===activeSong);if(x){x.title=val('songTitle')??x.title;x.artist=val('songArtist')??x.artist;x.url=val('songUrl')??x.url;x.notes=val('songNotes')??x.notes}}
if(view==='characters'&&activeCharacter){let x=p.characters.find(x=>x.id===activeCharacter);if(x){x.name=val('charName')??x.name;x.role=val('charRole')??x.role;x.notes=val('charNotes')??x.notes}}

document.addEventListener('input',e=>{if(e.target.closest('#app')&&['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))queueAutosave()});document.addEventListener('change',e=>{if(e.target.closest('#app')&&['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))queueAutosave()});window.addEventListener('beforeunload',flushEditor);
function renderNav(){let opts=current?[['overview','◈ Overview'],['ideas','✦ Idea Board'],['plotline','◇ Plotline'],['scenes','▣ Scenes'],['writing','✎ Writing'],['songs','♫ Music'],['characters','♙ Characters'],['notebook','✧ Notebook'],['settings','⚙ Project settings']]:[['home','▦ My projects'],['backup','⇩ Import / Export'],['cloud','☁ Cloud sync']];$('nav').innerHTML=opts.map(([v,l])=>`<button class="${view===v?'active':''}" onclick="setView('${v}')">${l}</button>`).join('')+(current?'<button onclick="goHome()">← All projects</button>':'')}
function render(){if(current&&!project()){current=null;view='home'}renderNav();let p=project();$('app').innerHTML=(!p?(view==='backup'?backupPage():view==='cloud'?cloudPage():homePage()):({overview:overviewPage,ideas:ideasPage,plotline:plotlinePage,scenes:scenesPage,writing:writingPage,songs:songsPage,characters:charactersPage,notebook:notebookPage,settings:settingsPage}[view]||overviewPage)(p));}
function homePage(){return `<div class="top"><div><div class="eyebrow">Your creative universe</div><h1 class="title">Every story starts <span class="tagline">somewhere.</span></h1><p class="sub">Create your own structure. Follow the ideas wherever they lead.</p></div>${b('+ New project','newProject()','primary')}</div>${data.projects.length?`<div class="grid">${data.projects.map((p,i)=>`<article class="project"><div class="cover" style="--a:${esc(p.colors?.[0]||'#4d397b')};--b:${esc(p.colors?.[1]||'#172d47')}"></div><div class="projectbody"><div class="meta">${esc(p.type)} · ${p.scenes.length} scenes</div><h3>${esc(p.name)}</h3><div class="meta">${esc(p.description||'An unwritten possibility.')}</div><div class="actions">${b('Open',`openProject('${p.id}')`,'primary')}${b('Duplicate',`duplicateProject('${p.id}')`,'ghost')}</div></div></article>`).join('')}</div>`:blank('Your library is waiting','Create your first project to begin.')}`}
function newProject(){modal(`<h2>Create a project</h2><p class="note">Film and Book are labels, not rigid templates. All tools are optional.</p>${field('pname','Project name')}${select('ptype','Project type',['Film','Book','Other'],'Film')}${field('pdesc','Short description (optional)')}<div class="row">${b('Create project','createProject()','primary')}${b('Cancel','closeModal()','ghost')}</div>`);$('pname').focus()}function createProject(){let name=$('pname').value.trim();if(!name)return toast('Enter a project name');let p={id:uid(),name,type:$('ptype').value,description:$('pdesc').value,colors:['#4c3479','#183e53'],sections:[],scenes:[],songs:[],characters:[],notes:[],ideas:[],writing:'',tools:{ideas:true,plotline:true,scenes:true,writing:true,songs:true,characters:true,notebook:true},createdAt:Date.now()};data.projects.push(p);closeModal();current=p.id;setView('overview');save()}function duplicateProject(id){let p=data.projects.find(x=>x.id===id);let copy=JSON.parse(JSON.stringify(p));copy.id=uid();const ids=new Map();for(const group of ['sections','scenes','songs','characters','notes','ideas'])for(const x of copy[group]||[]){const old=x.id;x.id=uid();ids.set(old,x.id)}for(const x of copy.sections||[])x.sceneIds=(x.sceneIds||[]).map(id=>ids.get(id)||id);for(const x of copy.ideas||[])if(x.sceneId)x.sceneId=ids.get(x.sceneId)||x.sceneId;for(const x of copy.scenes||[])x.songIds=(x.songIds||[]).map(id=>ids.get(id)||id);copy.name+=' (copy)';copy.createdAt=Date.now();data.projects.push(copy);persist();toast('Project duplicated')}
function overviewPage(p){let cards=[['ideas','✦','Idea Board','Collect and connect unfinished ideas'],['plotline','◇','Plotline','Shape your story, your way'],['scenes','▣','Scenes','Capture moments and ideas'],['writing','✎','Writing','Manuscript or screenplay'],['songs','♫','Music','Build your sonic palette'],['characters','♙','Characters','Develop your cast'],['notebook','✧','Notebook','Collect thoughts and direction']];return `<div class="top"><div><div class="eyebrow">${esc(p.type)} / Creative workspace</div><h1 class="title">${esc(p.name)}</h1><p class="sub">${esc(p.description||'An open canvas for your next story.')}</p></div>${b('⚙ Customize','setView(\'settings\')')}</div><div class="grid">${cards.filter(c=>p.tools[c[0]]!==false).map(([v,icon,t,d])=>`<div class="panel" style="cursor:pointer;min-height:145px" onclick="setView('${v}')"><div style="font-size:28px;color:var(--accent)">${icon}</div><h3 style="margin:8px 0 3px">${t}</h3><div class="small">${d}</div></div>`).join('')}</div><div class="panel"><div class="eyebrow">At a glance</div><h2>${p.scenes.length} scenes · ${p.songs.length} songs · ${(p.ideas||[]).length} ideas · ${p.notes.length} notes</h2><p class="note">Start anywhere. You don't need to establish a plotline before writing scenes. Your edits now save automatically as you type.</p></div>`}
function plotlinePage(p){let assigned=new Set(p.sections.flatMap(s=>s.sceneIds||[]));let loose=p.scenes.filter(s=>!assigned.has(s.id));return `<div class="top"><div><div class="eyebrow">Structure / Completely optional</div><h1 class="title">Plotline</h1><p class="sub">Create your own acts, chapters, arcs, or sections. Nothing is predefined.</p></div>${b('+ Add section','addSection()','primary')}</div><div class="panel"><div class="row"><strong>Story arrangement</strong><span class="chip">${p.sections.length} sections</span></div><p class="note">Use ↑ ↓ to reorder sections or scenes. Assign scenes to a section from the scene editor.</p></div>${p.sections.map((s,i)=>`<div class="section"><div class="row"><div><h3>${esc(s.name)}</h3><div class="small">${(s.sceneIds||[]).length} scenes</div></div><div class="actions">${b('↑',`moveSection('${s.id}',-1)`,'ghost')}${b('↓',`moveSection('${s.id}',1)`,'ghost')}${b('Rename',`renameSection('${s.id}')`,'ghost')}${b('×',`removeSection('${s.id}')`,'danger')}</div></div>${(s.sceneIds||[]).map((id,j)=>{let sc=p.scenes.find(x=>x.id===id);return sc?`<div class="scenechip"><span onclick="editScene('${id}')">${esc(sc.title)}</span><div class="actions">${b('↑',`moveSceneWithin('${s.id}','${id}',-1)`,'ghost')}${b('↓',`moveSceneWithin('${s.id}','${id}',1)`,'ghost')}</div></div>`:''}).join('')||'<p class="small">No scenes in this section yet</p>'}</div>`).join('')}${loose.length?`<div class="section"><h3>Unassigned scenes</h3><p class="small">Ideas that haven't found a place in the plotline yet.</p>${loose.map(s=>`<div class="scenechip" onclick="editScene('${s.id}')">${esc(s.title)} →</div>`).join('')}</div>`:''}${!p.sections.length&&!loose.length?blank('A blank plotline','Add sections when you are ready—or create scenes first.'):''}`}
function addSection(){modal(`<h2>New plotline section</h2>${field('secname','Section title','','text')}<p class="note">Examples: Act One, Chapter 3, The Reunion, or anything you invent.</p><div class="row">${b('Add section','createSection()','primary')}${b('Cancel','closeModal()')}</div>`)}function createSection(){let n=$('secname').value.trim();if(!n)return;project().sections.push({id:uid(),name:n,sceneIds:[]});closeModal();persist()}function renameSection(id){let s=project().sections.find(x=>x.id===id);modal(`<h2>Rename section</h2>${field('secname','Title',s.name)}${b('Save',`saveSectionName('${id}')`,'primary')} ${b('Cancel','closeModal()')}`)}function saveSectionName(id){let n=$('secname').value.trim();if(n)project().sections.find(s=>s.id===id).name=n;closeModal();persist()}function removeSection(id){if(!confirm('Remove this section? Its scenes will remain in your project as unassigned scenes.'))return;project().sections=project().sections.filter(s=>s.id!==id);persist()}function moveSection(id,d){let a=project().sections,i=a.findIndex(s=>s.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];persist()}function moveSceneWithin(sid,id,d){let a=project().sections.find(s=>s.id===sid).sceneIds,i=a.indexOf(id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];persist()}
function scenesPage(p){return `<div class="top"><div><div class="eyebrow">Story building</div><h1 class="title">Scenes</h1><p class="sub">Capture fragments, develop them, and connect them to the larger story.</p></div>${b('+ New scene','newScene()','primary')}</div><div class="two"><div class="panel"><div class="eyebrow">Scene library</div><div class="stack" style="margin-top:12px">${p.scenes.map(s=>`<div class="item ${activeScene===s.id?'selected':''}" onclick="editScene('${s.id}')"><h3>${esc(s.title)}</h3><div class="small">${esc(s.summary||'No description yet')}</div></div>`).join('')||blank('No scenes yet','Add your first moment.')}</div></div><div class="panel">${activeScene?sceneEditor(p):blank('Choose a scene','Select a scene on the left, or create a new one.')}</div></div>`}
function newScene(){flushEditor();let s={id:uid(),title:'Untitled scene',summary:'',story:'',direction:'',script:'',songIds:[],characterIds:[]};project().scenes.push(s);activeScene=s.id;sceneTab='story';view='scenes';save();render()}function editScene(id){flushEditor();activeScene=id;view='scenes';sceneTab='story';render()}function sceneEditor(p){let s=p.scenes.find(x=>x.id===activeScene);if(!s)return '';let sect=p.sections.find(x=>(x.sceneIds||[]).includes(s.id));return `<div class="row"><h2 style="margin:0">Scene editor</h2>${b('Delete scene',`deleteScene('${s.id}')`,'danger')}</div>${field('sceneTitle','Scene title',s.title)}${field('sceneSummary','One-line summary',s.summary)}<div class="field"><label>Plotline section (optional)</label><select id="sceneSection"><option value="">Unassigned</option>${p.sections.map(x=>`<option value="${x.id}" ${sect?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="tabbar">${[['story','Story'],['direction','Direction / imagery'],['script','Written scene'],['music','Linked songs']].map(([v,t])=>`<button class="${sceneTab===v?'active':''}" onclick="changeSceneTab('${v}')">${t}</button>`).join('')}</div>${sceneTab==='music'?`<div class="field"><label>Associated songs</label>${p.songs.length?p.songs.map(x=>`<label style="display:block;margin:8px 0"><input type="checkbox" class="songLink" value="${x.id}" ${(s.songIds||[]).includes(x.id)?'checked':''}> ${esc(x.title)} — ${esc(x.artist)}</label>`).join(''):'<p class="note">Add songs in the Music module first.</p>'}</div>`:field('sceneBody',sceneTab==='story'?'What happens?':sceneTab==='direction'?'Visual and directorial notes':'Manuscript or screenplay passage',s[sceneTab==='story'?'story':sceneTab==='direction'?'direction':'script'],'textarea')}<div class="row">${b('Save scene',`saveScene('${s.id}')`,'primary')}<span class="small">Changes are stored locally</span></div>`}
function changeSceneTab(tab){flushEditor();sceneTab=tab;render()}function saveScene(id,redraw=true){let p=project(),s=p.scenes.find(x=>x.id===id);if(!s)return;s.title=$('sceneTitle')?.value||s.title;s.summary=$('sceneSummary')?.value||'';let key=sceneTab==='story'?'story':sceneTab==='direction'?'direction':'script';if(sceneTab==='music')s.songIds=[...document.querySelectorAll('.songLink:checked')].map(x=>x.value);else s[key]=$('sceneBody')?.value||'';let secId=$('sceneSection')?.value||'';p.sections.forEach(x=>x.sceneIds=x.sceneIds.filter(i=>i!==id));if(secId)p.sections.find(x=>x.id===secId)?.sceneIds.push(id);save();if(redraw){render();toast('Scene saved')}}function deleteScene(id){if(!confirm('Delete this scene?'))return;let p=project();p.scenes=p.scenes.filter(s=>s.id!==id);p.sections.forEach(s=>s.sceneIds=s.sceneIds.filter(x=>x!==id));activeScene=null;persist()}
function writingPage(p){return `<div class="top"><div><div class="eyebrow">Long-form writing</div><h1 class="title">Writing</h1><p class="sub">A freeform writing space, alongside passages saved in individual scenes.</p></div>${b('Save writing','saveWriting()','primary')}</div><div class="panel">${field('writingBody','Project manuscript / screenplay',p.writing||'','textarea')}<p class="note">Scene-specific writing stays in the scene editor. This is an additional project-wide document.</p></div><div class="panel"><h3>Scene passages</h3>${p.scenes.filter(s=>s.script?.trim()).map(s=>`<div class="section"><strong>${esc(s.title)}</strong><p style="white-space:pre-wrap">${esc(s.script)}</p></div>`).join('')||'<p class="note">No scene passages yet.</p>'}</div>`}function saveWriting(){project().writing=$('writingBody').value;save();toast('Writing saved')}
function songsPage(p){return `<div class="top"><div><div class="eyebrow">Music and inspiration</div><h1 class="title">Music</h1><p class="sub">Build a soundtrack or simply collect the songs that spark ideas.</p></div>${b('+ Add song','newSong()','primary')}</div><div class="two"><div class="panel"><div class="stack">${p.songs.map(s=>`<div class="item ${activeSong===s.id?'selected':''}" onclick="editSong('${s.id}')"><h3>♫ ${esc(s.title)}</h3><div class="small">${esc(s.artist)}</div></div>`).join('')||blank('No songs yet','Add a song to your project.')}</div></div><div class="panel">${activeSong?songEditor(p):blank('Song notes','Select a song to capture its imagery, emotion, or story ideas.')}</div></div>`}function newSong(){let s={id:uid(),title:'Untitled song',artist:'',url:'',notes:''};project().songs.push(s);activeSong=s.id;persist()}function editSong(id){flushEditor();activeSong=id;render()}function songEditor(p){let s=p.songs.find(x=>x.id===activeSong);return `<h2>Song details</h2>${field('songTitle','Title',s.title)}${field('songArtist','Artist',s.artist)}${field('songUrl','Spotify / reference URL',s.url)}${field('songNotes','Images, emotions, interpretations',s.notes,'textarea')}<div class="row">${b('Save song',`saveSong('${s.id}')`,'primary')}${b('Delete',`deleteSong('${s.id}')`,'danger')}</div>`}function saveSong(id){let s=project().songs.find(x=>x.id===id);s.title=$('songTitle').value;s.artist=$('songArtist').value;s.url=$('songUrl').value;s.notes=$('songNotes').value;persist();toast('Song saved')}function deleteSong(id){if(!confirm('Delete song?'))return;let p=project();p.songs=p.songs.filter(x=>x.id!==id);p.scenes.forEach(s=>s.songIds=s.songIds.filter(x=>x!==id));activeSong=null;persist()}
function charactersPage(p){return `<div class="top"><div><div class="eyebrow">People and perspectives</div><h1 class="title">Characters</h1><p class="sub">Develop characters, motivations, contradictions, and arcs.</p></div>${b('+ Add character','newCharacter()','primary')}</div><div class="two"><div class="panel"><div class="stack">${p.characters.map(c=>`<div class="item ${activeCharacter===c.id?'selected':''}" onclick="flushEditor();activeCharacter='${c.id}';render()"><h3>${esc(c.name)}</h3><div class="small">${esc(c.role)}</div></div>`).join('')||blank('No characters yet','Start with a name or an idea.')}</div></div><div class="panel">${activeCharacter?characterEditor(p):blank('Character profile','Select a character to edit.')}</div></div>`}function newCharacter(){let c={id:uid(),name:'Unnamed character',role:'',notes:''};project().characters.push(c);activeCharacter=c.id;persist()}function characterEditor(p){let c=p.characters.find(x=>x.id===activeCharacter);return `<h2>Character profile</h2>${field('charName','Name',c.name)}${field('charRole','Role / relationship',c.role)}${field('charNotes','Background, motivation, arc',c.notes,'textarea')}<div class="row">${b('Save',`saveCharacter('${c.id}')`,'primary')}${b('Delete',`deleteCharacter('${c.id}')`,'danger')}</div>`}function saveCharacter(id){let c=project().characters.find(x=>x.id===id);c.name=$('charName').value;c.role=$('charRole').value;c.notes=$('charNotes').value;persist()}function deleteCharacter(id){if(!confirm('Delete character?'))return;project().characters=project().characters.filter(x=>x.id!==id);activeCharacter=null;persist()}
function notebookPage(p){return `<div class="top"><div><div class="eyebrow">Creative fragments</div><h1 class="title">Notebook</h1><p class="sub">A home for ideas that aren't ready to become scenes.</p></div>${b('+ New note','newNote()','primary')}</div><div class="two"><div class="panel"><div class="stack">${p.notes.map(n=>`<div class="item ${activeNote===n.id?'selected':''}" onclick="flushEditor();activeNote='${n.id}';render()"><h3>${esc(n.title)}</h3><div class="small">${esc(n.body.slice(0,100))}</div></div>`).join('')||blank('No notes yet','Capture an idea, however unfinished.')}</div></div><div class="panel">${activeNote?noteEditor(p):blank('Notebook','Select or create a note.')}</div></div>`}function newNote(){let n={id:uid(),title:'Untitled note',body:''};project().notes.push(n);activeNote=n.id;persist()}function noteEditor(p){let n=p.notes.find(x=>x.id===activeNote);return `<h2>Notebook entry</h2>${field('noteTitle','Title',n.title)}${field('noteBody','Note',n.body,'textarea')}<div class="row">${b('Save',`saveNote('${n.id}')`,'primary')}${b('Delete',`deleteNote('${n.id}')`,'danger')}</div>`}function saveNote(id){let n=project().notes.find(x=>x.id===id);n.title=$('noteTitle').value;n.body=$('noteBody').value;persist()}function deleteNote(id){if(!confirm('Delete note?'))return;project().notes=project().notes.filter(x=>x.id!==id);activeNote=null;persist()}
const IDEA_TYPES=['Thought','Scene seed','Dialogue','Visual','Music','Character','Research'];const IDEA_COLORS=['#334e78','#5b3a76','#275b62','#684a37','#4d6250','#6a3657'];
function ideasPage(p){p.ideas??=[];let cards=p.ideas.filter(x=>(ideaFilter==='All'||x.type===ideaFilter)&&(!ideaQuery||[x.title,x.body,x.type].join(' ').toLowerCase().includes(ideaQuery.toLowerCase())));return `<div class="top"><div><div class="eyebrow">Creative playground / No structure required</div><h1 class="title">Idea Board <span class="tagline">✦</span></h1><p class="sub">Collect fragments. Move them around. Turn an idea into a scene when it feels ready.</p></div>${b('+ Capture idea','newIdea()','primary')}</div><div class="idea-toolbar"><input class="idea-search" aria-label="Search ideas" placeholder="Search your ideas…" value="${esc(ideaQuery)}" oninput="ideaQuery=this.value;refreshIdeas()"><select class="idea-search" aria-label="Filter idea type" onchange="ideaFilter=this.value;refreshIdeas()"><option>All</option>${IDEA_TYPES.map(t=>`<option ${ideaFilter===t?'selected':''}>${t}</option>`).join('')}</select>${b('Reset filters','resetIdeaFilters()','ghost')}<span class="chip">${cards.length} / ${p.ideas.length} ideas</span></div><div class="idea-board" id="ideaBoard">${cards.map(x=>`<article class="idea-card" draggable="true" data-id="${x.id}" style="--idea-color:${IDEA_COLORS.includes(x.color)?x.color:IDEA_COLORS[0]}" ondragstart="ideaDragStart(event,'${x.id}')" ondragover="ideaDragOver(event,'${x.id}')" ondragleave="this.classList.remove('over')" ondrop="ideaDrop(event,'${x.id}')" ondragend="ideaDragEnd()"><div class="row"><span class="idea-type">${esc(x.type)}</span><button onclick="editIdea('${x.id}')" title="Edit idea">✎ Edit</button></div><h3>${esc(x.title||'Untitled idea')}</h3><p>${esc((x.body||'').slice(0,300))}${(x.body||'').length>300?'…':''}</p><div class="idea-bottom"><span class="idea-preview">${x.sceneId?'Linked to scene':'Unassigned idea'}</span><button onclick="makeSceneFromIdea('${x.id}')" title="Create a new scene from this idea">↗ Scene</button></div></article>`).join('')}<div class="idea-drop" ondragover="event.preventDefault()" ondrop="ideaDrop(event,null)" onclick="newIdea()">＋ Add another idea</div></div><p class="note">Drag cards to change their order. Your ideas are saved automatically on this device. Creating a scene keeps the original idea.</p>`}
function refreshIdeas(){let p=project();if(!p)return;let cursor=document.activeElement,searching=cursor?.classList?.contains('idea-search')&&cursor.tagName==='INPUT';let pos=searching?cursor.selectionStart:null;let html=ideasPage(p);$('app').innerHTML=html;if(searching){let el=$('.idea-search');el.focus();el.setSelectionRange(pos,pos)}}
function resetIdeaFilters(){ideaFilter='All';ideaQuery='';render()}
function newIdea(){editIdea(null)}
function editIdea(id){flushEditor();let x=id?(project().ideas||[]).find(a=>a.id===id):null;modal(`<div class="idea-editor"><div class="eyebrow">${x?'Edit your idea':'Capture something new'}</div><h2>${x?'Develop this idea':'New idea'}</h2>${field('ideaTitle','Title',x?.title||'')}${select('ideaType','Kind of idea',IDEA_TYPES,x?.type||'Thought')}${field('ideaBody','Describe it — a fragment is enough',x?.body||'','textarea')}<div class="field"><label>Card color</label><div class="row" style="justify-content:flex-start">${IDEA_COLORS.map(c=>`<label title="Color ${c}" style="display:inline-flex;align-items:center;gap:4px"><input type="radio" name="ideaColor" value="${c}" ${c===(x?.color||IDEA_COLORS[0])?'checked':''}><span style="width:25px;height:25px;border-radius:8px;background:${c};display:inline-block"></span></label>`).join('')}</div></div><div class="row">${b(x?'Save changes':'Add to board',`saveIdea(${id?`'${id}'`:'null'})`,'primary')}${x?b('Delete idea',`deleteIdea('${id}')`,'danger'):''}${b('Cancel','closeModal()','ghost')}</div></div>`);$('ideaTitle').focus()}
function saveIdea(id){let p=project();p.ideas??=[];let x=id?p.ideas.find(a=>a.id===id):null;if(!x){x={id:uid(),sceneId:null};p.ideas.push(x)}x.title=$('ideaTitle').value.trim()||'Untitled idea';x.type=$('ideaType').value;x.body=$('ideaBody').value;x.color=document.querySelector('input[name="ideaColor"]:checked')?.value||IDEA_COLORS[0];x.updatedAt=Date.now();closeModal();save();render();toast('Idea saved')}
function deleteIdea(id){if(!confirm('Delete this idea? Linked scenes will not be deleted.'))return;project().ideas=project().ideas.filter(x=>x.id!==id);closeModal();save();render()}
function makeSceneFromIdea(id){flushEditor();let p=project(),x=(p.ideas||[]).find(a=>a.id===id);if(!x)return;let s={id:uid(),title:x.title||'Untitled scene',summary:'',story:x.body||'',direction:'',script:'',songIds:[],characterIds:[]};p.scenes.push(s);x.sceneId=s.id;activeScene=s.id;sceneTab='story';view='scenes';save();render();toast('Scene created; original idea kept')}
let draggedIdea=null;function ideaDragStart(e,id){draggedIdea=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);e.currentTarget.classList.add('dragging')}
function ideaDragOver(e,id){if(!draggedIdea||draggedIdea===id)return;e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('over')}
function ideaDragEnd(){draggedIdea=null;document.querySelectorAll('.idea-card').forEach(x=>x.classList.remove('dragging','over'))}
function ideaDrop(e,id){e.preventDefault();e.stopPropagation();let from=draggedIdea||e.dataTransfer.getData('text/plain'),arr=project().ideas||[],a=arr.findIndex(x=>x.id===from);if(a<0){ideaDragEnd();return}let item=arr.splice(a,1)[0],b=id?arr.findIndex(x=>x.id===id):arr.length;arr.splice(b<0?arr.length:b,0,item);ideaDragEnd();save();render()}
function settingsPage(p){let tools=[['ideas','Idea Board'],['plotline','Plotline'],['scenes','Scenes'],['writing','Writing'],['songs','Music'],['characters','Characters'],['notebook','Notebook']];return `<div class="top"><div><div class="eyebrow">Project preferences</div><h1 class="title">Project settings</h1><p class="sub">Make the workspace fit the story, not the other way around.</p></div></div><div class="panel">${field('settingsName','Project title',p.name)}${select('settingsType','Project type',['Film','Book','Other'],p.type)}${field('settingsDesc','Description',p.description,'textarea')}${b('Save details','saveSettings()','primary')}</div><div class="panel"><h3>Visible modules</h3><p class="note">Hiding a module does not delete its data.</p><div class="toolgrid">${tools.map(([k,t])=>`<label class="tool"><input type="checkbox" ${p.tools[k]!==false?'checked':''} onchange="toggleTool('${k}',this.checked)"> <b style="display:inline">${t}</b></label>`).join('')}</div></div><div class="panel"><h3>Project actions</h3><div class="actions">${b('Duplicate project',`duplicateProject('${p.id}')`)}${b('Delete project',`deleteProject('${p.id}')`,'danger')}</div></div>`}function saveSettings(){let p=project();p.name=$('settingsName').value.trim()||p.name;p.type=$('settingsType').value;p.description=$('settingsDesc').value;persist();toast('Settings saved')}function toggleTool(k,v){project().tools[k]=v;save();renderNav()}function deleteProject(id){if(!confirm('Permanently delete this project and its contents? Export a backup first if needed.'))return;data.projects=data.projects.filter(p=>p.id!==id);current=null;view='home';persist()}
function backupPage(){return `<div class="eyebrow">Your data</div><h1 class="title">Import & Export</h1><p class="sub">Your projects are currently stored only in this browser on this device. Cloud sync is optional; enable it in Cloud sync once your account is ready.</p><div class="panel"><h2>Download a backup</h2><p class="note">Export all projects as a JSON file. Keep a copy somewhere safe.</p>${b('↓ Export all projects','exportData()','primary')}</div><div class="panel"><h2>Restore from backup</h2><p class="note">Import a Project Studio Version 2 JSON backup. Import replaces the projects currently in this browser.</p>${b('↑ Import JSON backup',"$('importFile').click()")}</div>`}function exportData(){flushEditor();let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='project-studio-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.projects)||d.version!==2)throw Error('Unsupported backup format');if(!confirm('Replace all locally stored projects with the imported backup?'))return;data=d;current=null;view='home';persist();toast('Backup imported')}catch(err){alert('Could not import: '+err.message)}finally{e.target.value=''}});

let draggedSceneId=null;
plotlinePage=function(p){
 const assigned=new Set(p.sections.flatMap(x=>x.sceneIds||[]));
 const loose=p.scenes.filter(x=>!assigned.has(x.id));
 const col=(sec,scenes)=>`<section class="boardcol" data-section="${sec?.id||''}" ondragover="boardOver(event)" ondragleave="boardLeave(event)" ondrop="boardDrop(event,'${sec?.id||''}')"><div class="boardhead"><div><div class="eyebrow">${sec?'STORY SECTION':'IDEA POOL'}</div><h3>${esc(sec?.name||'Unassigned scenes')}</h3><span class="small">${scenes.length} scene${scenes.length===1?'':'s'}</span></div>${sec?`<button class="btn ghost" onclick="renameSection('${sec.id}')" title="Rename section">✎</button>`:''}</div><div class="boardcards">${scenes.map(sc=>`<article class="storycard" draggable="true" ondragstart="boardStart(event,'${sc.id}')" ondragend="boardEnd(event)" ondragover="cardOver(event)" ondragleave="cardLeave(event)" ondrop="cardDrop(event,'${sec?.id||''}','${sc.id}')" onclick="boardCardClick(event,'${sc.id}')"><div class="eyebrow">SCENE</div><h4>${esc(sc.title)}</h4><p>${esc(sc.summary||'Open to develop this scene')}</p><div class="small" style="margin-top:8px">${(sc.songIds||[]).length?'♫ '+sc.songIds.length+' linked song(s)':'Drag to arrange · Click to edit'}</div></article>`).join('')||'<p class="boardhint">Drop a scene here</p>'}</div>${sec?`<div class="actions" style="margin-top:14px">${b('+ Scene',`newSceneInSection('${sec.id}')`,'ghost')}${b('←',`moveSection('${sec.id}',-1)`,'ghost')}${b('→',`moveSection('${sec.id}',1)`,'ghost')}${b('×',`removeSection('${sec.id}')`,'danger')}</div>`:''}</section>`;
 return `<div class="top"><div><div class="eyebrow">Visual story structure · Optional</div><h1 class="title">Plotline</h1><p class="sub">Organize your story into any sections you choose. Drag scene cards between sections or back into the idea pool.</p></div></div><div class="boardtoolbar">${b('+ Add section','addSection()','primary')}${b('+ New scene','newScene()')}${b('Export backup','exportData()','ghost')}</div><div class="board">${p.sections.map(sec=>col(sec,(sec.sceneIds||[]).map(id=>p.scenes.find(s=>s.id===id)).filter(Boolean))).join('')}${col(null,loose)}</div>${!p.sections.length?'<p class="note" style="margin-top:20px">No sections yet. You can create scenes first and organize them whenever you like.</p>':''}`;
};
let dragRecentlyEnded=false;
function boardStart(ev,id){draggedSceneId=id;dragRecentlyEnded=false;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',id);ev.currentTarget.classList.add('dragging')}
function boardOver(ev){ev.preventDefault();ev.dataTransfer.dropEffect='move';ev.currentTarget.classList.add('dragover')}
function boardLeave(ev){if(!ev.currentTarget.contains(ev.relatedTarget))ev.currentTarget.classList.remove('dragover')}
function cardOver(ev){ev.preventDefault();ev.stopPropagation();ev.dataTransfer.dropEffect='move';document.querySelectorAll('.storycard.drop-before,.storycard.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'));const r=ev.currentTarget.getBoundingClientRect();ev.currentTarget.classList.add(ev.clientY<r.top+r.height/2?'drop-before':'drop-after')}
function cardLeave(ev){ev.currentTarget.classList.remove('drop-before','drop-after')}
function boardEnd(ev){document.querySelectorAll('.boardcol,.storycard').forEach(e=>e.classList.remove('dragover','drop-before','drop-after','dragging'));draggedSceneId=null;dragRecentlyEnded=true}
function boardCardClick(ev,id){if(dragRecentlyEnded){dragRecentlyEnded=false;return}editScene(id)}
function moveCardTo(id,secId,targetId,after){let p=project();if(!p.scenes.some(s=>s.id===id))return;let targetSection=p.sections.find(s=>s.id===secId);if(secId&&!targetSection)return;
 const assignedBefore=new Set(p.sections.flatMap(s=>s.sceneIds||[]));const loose=p.scenes.filter(s=>!assignedBefore.has(s.id)).map(s=>s.id);
 p.sections.forEach(s=>s.sceneIds=(s.sceneIds||[]).filter(x=>x!==id));
 if(targetSection){let arr=targetSection.sceneIds;let at=targetId?arr.indexOf(targetId):-1;if(at<0)at=arr.length;else if(after)at++;arr.splice(at,0,id)}
 else {let order=loose.filter(x=>x!==id);let at=targetId?order.indexOf(targetId):-1;if(at<0)at=order.length;else if(after)at++;order.splice(at,0,id);let map=new Map(p.scenes.map(x=>[x.id,x]));let assigned=p.scenes.filter(x=>!order.includes(x.id));p.scenes=[...assigned,...order.map(x=>map.get(x)).filter(Boolean)]}
 draggedSceneId=null;dragRecentlyEnded=true;save();render();toast('Scene moved')}
function cardDrop(ev,secId,targetId){ev.preventDefault();ev.stopPropagation();let id=draggedSceneId||ev.dataTransfer.getData('text/plain');if(!id||id===targetId)return;let r=ev.currentTarget.getBoundingClientRect();moveCardTo(id,secId,targetId,ev.clientY>=r.top+r.height/2)}
function boardDrop(ev,secId){ev.preventDefault();let id=draggedSceneId||ev.dataTransfer.getData('text/plain');if(id)moveCardTo(id,secId,null,true)}
function newSceneInSection(secId){newScene();let p=project(),sec=p.sections.find(x=>x.id===secId);if(sec&&activeScene){sec.sceneIds.push(activeScene);save();render()}}
sceneEditor=function(p){let s=p.scenes.find(x=>x.id===activeScene);if(!s)return '';let sec=p.sections.find(x=>(x.sceneIds||[]).includes(s.id));return `<div class="row" style="margin-bottom:14px"><div><div class="eyebrow">Unified creative workspace</div><h2 style="margin:0">Develop this scene</h2></div>${b('Delete',`deleteScene('${s.id}')`,'danger')}</div><div class="workspace-meta">${field('sceneTitle','Scene title',s.title)}${field('sceneSummary','One-line summary',s.summary)}</div><div class="field"><label>Plotline section (optional)</label><select id="sceneSection"><option value="">Unassigned</option>${p.sections.map(x=>`<option value="${x.id}" ${sec?.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="scene-workspace"><div class="workspace-panel"><h3>✎ Story & writing</h3>${field('sceneStory','What happens in this scene?',s.story||'','textarea')}${field('sceneScript','Manuscript / screenplay passage',s.script||'','textarea')}<p class="mini-note">Your story concept and finished writing stay linked to the same scene.</p></div><div class="workspace-panel"><h3>◈ Direction & connections</h3>${field('sceneDirection','Visual treatment / direction',s.direction||'','textarea')}<div class="field"><label>Linked music</label>${p.songs.length?p.songs.map(x=>`<label class="linkrow"><input type="checkbox" class="songLink" value="${x.id}" ${(s.songIds||[]).includes(x.id)?'checked':''}> <span>${esc(x.title)} <span class="small">— ${esc(x.artist)}</span></span></label>`).join(''):'<p class="mini-note">Add music to this project to link songs to your scene.</p>'}</div><div class="field"><label>Characters in this scene</label>${p.characters.length?p.characters.map(x=>`<label class="linkrow"><input type="checkbox" class="characterLink" value="${x.id}" ${(s.characterIds||[]).includes(x.id)?'checked':''}> <span>${esc(x.name)}</span></label>`).join(''):'<p class="mini-note">Add characters to your project to connect them here.</p>'}</div></div></div><div class="row" style="margin-top:15px">${b('Save scene',`saveScene('${s.id}')`,'primary')}<span class="small">Auto-saved on this device · Export JSON for backup</span></div>`};
// Preserve the existing autosave behavior while supporting the new side-by-side editor.
const flushV3=flushEditor;
flushEditor=function(){if(view==='scenes'&&activeScene&&$('sceneStory')){clearTimeout(autosaveTimer);let p=project(),s=p?.scenes.find(x=>x.id===activeScene);if(!s)return;if($('sceneTitle'))s.title=$('sceneTitle').value;if($('sceneSummary'))s.summary=$('sceneSummary').value;s.story=$('sceneStory').value;s.script=$('sceneScript').value;s.direction=$('sceneDirection').value;s.songIds=[...document.querySelectorAll('.songLink:checked')].map(x=>x.value);s.characterIds=[...document.querySelectorAll('.characterLink:checked')].map(x=>x.value);let secId=$('sceneSection')?.value||'';let old=p.sections.find(x=>(x.sceneIds||[]).includes(s.id))?.id||'';if(secId!==old){p.sections.forEach(x=>x.sceneIds=(x.sceneIds||[]).filter(i=>i!==s.id));if(secId)p.sections.find(x=>x.id===secId)?.sceneIds.push(s.id)}save();return}flushV3()};
saveScene=function(id,redraw=true){flushEditor();if(redraw){render();toast('Scene saved')}};
// Ensure scene links remain correct when duplicating projects.
const duplicateV3=duplicateProject;
duplicateProject=function(id){duplicateV3(id);let original=data.projects.find(p=>p.id===id),copy=data.projects[data.projects.length-1];if(!original||!copy||copy.id===id)return;for(let i=0;i<copy.scenes.length;i++){let src=original.scenes[i],dst=copy.scenes[i];if(!src||!dst)continue;dst.characterIds=(src.characterIds||[]).map(cid=>{let idx=original.characters.findIndex(c=>c.id===cid);return idx>=0?copy.characters[idx].id:null}).filter(Boolean)}save()};

window.addEventListener('beforeunload',()=>{if(current){let p=project();if(view==='writing'&&$('writingBody'))p.writing=$('writingBody').value;if(view==='scenes'&&activeScene&&$('sceneTitle'))saveScene(activeScene,false);if(view==='songs'&&activeSong&&$('songTitle')){let s=p.songs.find(x=>x.id===activeSong);s.title=$('songTitle').value;s.artist=$('songArtist').value;s.url=$('songUrl').value;s.notes=$('songNotes').value}save()}});render();

// CLOUD SYNC — optional Supabase connection. Never put service-role keys in this application.
const CLOUD_CONFIG_KEY='project-studio-cloud-config';
let cloudClient=null,cloudUser=null,cloudRevision=null,cloudBusy=false,cloudDirty=false,cloudTimer=null,cloudReady=false,cloudMessage='Not connected';
function cloudConfig(){try{return JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||'null')}catch{return null}}
function cloudQueue(){if(!cloudReady||!cloudUser)return;cloudDirty=true;clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudPush,1300)}
function cloudStatus(msg){cloudMessage=msg;let el=$('cloudState');if(el)el.textContent=msg}
function cloudPage(){let cfg=cloudConfig();return `<div class="eyebrow">Cross-device workspace</div><h1 class="title">Cloud synchronization</h1><p class="sub">Your projects remain private to your account. Sync works after connecting Supabase and hosting this file at an HTTPS address.</p><div class="panel"><h2>Connection</h2><p id="cloudState" class="note">${esc(cloudMessage)}</p>${field('cloudUrl','Supabase project URL',cfg?.url||'')}${field('cloudKey','Supabase publishable / anon key',cfg?.key||'')}<div class="actions">${b('Connect','cloudConnectForm()','primary')}${b('Disconnect','cloudDisconnect()','ghost')}</div><p class="note">Use only the public publishable/anon key. Never enter a service-role or secret key.</p></div><div class="panel"><h2>Private account</h2>${field('cloudEmail','Email address',cloudUser?.email||'','email')}${field('cloudPassword','Password','','password')}<div class="actions">${b('Sign in','cloudLogin()','primary')}${b('Forgot password?','cloudResetRequest()','ghost')}${b('Create account','cloudSignup()')}${b('Sign out','cloudLogout()')}</div><p class="note">Account creation may require email confirmation. For password recovery, connect first, enter your email, then click Forgot password? The app must be hosted at its HTTPS GitHub Pages address.</p></div><div class="panel"><h2>Synchronize</h2><p class="note">When you first connect, choose whether to download your existing cloud library or upload the projects currently saved on this device. Never upload an empty library over an existing one.</p><div class="actions">${b('Download cloud projects','cloudDownload()','primary')}${b('Upload this device’s projects','cloudUploadInitial()')}${b('Sync now','cloudSyncNow()')}</div><p class="note">Automatic syncing starts after the initial download/upload. Conflicting edits are not overwritten automatically. Keep JSON exports as an additional backup.</p></div>`}
async function ensureSupabaseLibrary(){
 if(window.supabase?.createClient)return;
 for(const url of ['https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js']){
  try{await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=url;script.onload=resolve;script.onerror=()=>reject(Error('Script unavailable'));document.head.appendChild(script)});if(window.supabase?.createClient)return}catch(e){}
 }
 throw Error('Supabase library could not load. Check internet/CDN access. If using a local file, host this app over HTTPS.');
}
let cloudClientSignature='', cloudAuthSubscription=null, cloudConnectPending=false;
async function cloudInitialize(){
 const c=cloudConfig();
 if(!c?.url||!c?.key){cloudStatus('Enter your Supabase connection settings');return}
 if(cloudConnectPending){cloudStatus('Connection already in progress…');return}
 cloudConnectPending=true;
 try{
  cloudStatus('Loading Supabase client…');
  await ensureSupabaseLibrary();
  const signature=c.url+'|'+c.key;
  if(!cloudClient||cloudClientSignature!==signature){
   if(cloudAuthSubscription){cloudAuthSubscription.unsubscribe();cloudAuthSubscription=null}
   cloudClient=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'project-studio-auth-v7'}});
   cloudClientSignature=signature;
   const {data:listener}=cloudClient.auth.onAuthStateChange((event,session)=>{
    const oldId=cloudUser?.id;
    cloudUser=session?.user||null;
    if(event==='SIGNED_OUT'||(oldId&&cloudUser&&oldId!==cloudUser.id)){
     cloudReady=false;cloudRevision=null;cloudDirty=false;
    }
    if(event==='SIGNED_IN'&&cloudUser&&!cloudReady)cloudStatus('Signed in as '+cloudUser.email+'. Choose initial download or upload.');
    if(event==='SIGNED_OUT')cloudStatus('Signed out. Connect or sign in to sync.');
    if(event==='PASSWORD_RECOVERY')setTimeout(showRecoveryDialog,0);
   });
   cloudAuthSubscription=listener.subscription;
  }
  // getSession is local and doesn't depend on an auth network request.
  const {data:sessionData,error:sessionError}=await cloudClient.auth.getSession();
  if(sessionError)throw sessionError;
  cloudUser=sessionData?.session?.user||null;
  cloudStatus('Checking connection to Supabase…');
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),9000);
  try{
   const response=await fetch(c.url+'/auth/v1/health',{headers:{apikey:c.key},signal:controller.signal});
   if(!response.ok)throw Error('Supabase returned HTTP '+response.status+'; check project URL and publishable key');
  }finally{clearTimeout(timeout)}
  cloudStatus(cloudUser?'✓ Connected; signed in as '+cloudUser.email+'. Choose initial download or upload.':'✓ Connected to Supabase. Sign in or create your private account.');
 }catch(e){
  const message=e?.name==='AbortError'?'Connection timed out. Check your internet connection, network restrictions, or Supabase project status.':e?.message||String(e);
  cloudStatus('Connection error: '+message);
  console.error('Project Studio connection error:',e);
 }finally{cloudConnectPending=false}
}
async function cloudConnectForm(){
 try{
  const url=$('cloudUrl').value.trim().replace(/\/rest\/v1\/?$/,'').replace(/\/+$/,''),key=$('cloudKey').value.trim();
  if(!/^https:\/\/[^\s/]+\.supabase\.co$/.test(url)||!key){cloudStatus('Enter your base Supabase HTTPS project URL (without /rest/v1) and publishable key');return}
  localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify({url,key}));
  await cloudInitialize();
 }catch(e){cloudStatus('Connection error: '+(e?.message||String(e)));console.error(e)}
}
async function cloudLogin(){
 if(!cloudClient)return cloudStatus('Connect to Supabase first');
 const email=$('cloudEmail')?.value.trim(),password=$('cloudPassword')?.value;
 if(!email||!password)return cloudStatus('Enter your account email and password.');
 cloudStatus('Signing in…');
 try{
  const {data:result,error}=await cloudClient.auth.signInWithPassword({email,password});
  if(error)throw error;
  cloudUser=result?.user||null;
  render();cloudStatus('✓ Signed in as '+(cloudUser?.email||email)+'. Choose initial download or upload.');
 }catch(e){cloudStatus('Sign-in failed: '+(e?.message||String(e)));}
}
async function cloudSignup(){
 if(!cloudClient)return cloudStatus('Connect to Supabase first');
 const email=$('cloudEmail')?.value.trim(),password=$('cloudPassword')?.value;
 if(!email||!password)return cloudStatus('Enter an email and password first.');
 try{const {error}=await cloudClient.auth.signUp({email,password});if(error)throw error;cloudStatus('Account request submitted. Check your email for confirmation, then sign in.');}
 catch(e){cloudStatus('Account creation failed: '+(e?.message||String(e)));}
}
async function cloudResetRequest(){
 if(!cloudClient)return cloudStatus('Connect to Supabase first');
 const email=$('cloudEmail')?.value.trim();
 if(!email)return cloudStatus('Enter your email address first.');
 if(location.protocol!=='https:')return cloudStatus('Open Project Studio at its published HTTPS GitHub Pages URL before requesting a reset.');
 const redirectTo=location.origin+location.pathname;
 cloudStatus('Requesting a password reset email…');
 try{
  const {error}=await cloudClient.auth.resetPasswordForEmail(email,{redirectTo});
  if(error)throw error;
  cloudStatus('If this account exists, a recovery email will arrive. Open its link in this browser.');
 }catch(e){cloudStatus('Password reset request failed: '+(e?.message||String(e)));}
}
function showRecoveryDialog(){
 modal(`<h2>Set a new password</h2><p class="note">Your recovery link was accepted. Choose a new Project Studio password.</p>${field('recoveryPassword','New password','','password')}${field('recoveryConfirm','Confirm new password','','password')}<div class="actions">${b('Update password','cloudUpdatePassword()','primary')}</div><p id="recoveryStatus" class="note"></p>`);
}
async function cloudUpdatePassword(){
 const pw=$('recoveryPassword')?.value,confirmPw=$('recoveryConfirm')?.value,el=$('recoveryStatus');
 if(!pw||pw.length<8){el.textContent='Use a password with at least 8 characters.';return}
 if(pw!==confirmPw){el.textContent='Passwords do not match.';return}
 try{
  if(!cloudClient)throw Error('Connect to Supabase first.');
  el.textContent='Updating password…';
  const {error}=await cloudClient.auth.updateUser({password:pw});
  if(error)throw error;
  closeModal();cloudStatus('✓ Password updated. You can now sign in with your new password.');
 }catch(e){el.textContent='Password update failed: '+(e?.message||String(e))}
}
async function cloudLogout(){
 try{if(cloudClient){const {error}=await cloudClient.auth.signOut();if(error)throw error;}}
 catch(e){return cloudStatus('Sign-out failed: '+(e?.message||String(e)))}
 cloudReady=false;cloudUser=null;cloudRevision=null;render();cloudStatus('Signed out');
}
function cloudDisconnect(){if(cloudAuthSubscription){cloudAuthSubscription.unsubscribe();cloudAuthSubscription=null}cloudReady=false;cloudUser=null;cloudClient=null;cloudClientSignature='';cloudRevision=null;clearTimeout(cloudTimer);localStorage.removeItem(CLOUD_CONFIG_KEY);cloudStatus('Disconnected; projects remain saved locally');render()}
async function cloudFetch(){if(!cloudClient||!cloudUser)throw Error('Sign in first');let {data:row,error}=await cloudClient.from('studio_documents').select('content,revision').eq('user_id',cloudUser.id).maybeSingle();if(error)throw error;return row}
async function cloudDownload(){try{flushEditor();let row=await cloudFetch();if(!row){cloudStatus('No cloud library exists yet. Use Upload this device’s projects.');return}if(!Array.isArray(row.content?.projects))throw Error('Cloud data format is invalid');if(data.projects.length&&!confirm('Replace this device’s projects with your cloud library? Export JSON first if needed.'))return;data=row.content;cloudRevision=row.revision;cloudReady=true;cloudDirty=false;current=null;view='home';localStorage.setItem(KEY,JSON.stringify(data));render();cloudStatus('✓ Cloud projects downloaded. Auto-sync active.')}catch(e){cloudStatus('Download failed: '+e.message)}}
async function cloudUploadInitial(){try{flushEditor();let row=await cloudFetch();if(row){cloudStatus('A cloud library already exists. Download it first to avoid overwriting work.');return}if(!confirm('Create your cloud library using the projects saved on this device?'))return;let {data:r,error}=await cloudClient.rpc('studio_save_document',{expected_revision:null,new_content:data});if(error)throw error;cloudRevision=r;cloudReady=true;cloudDirty=false;cloudStatus('✓ Cloud library created. Auto-sync active.')}catch(e){cloudStatus('Upload failed: '+e.message)}}
async function cloudPush(){if(!cloudReady||!cloudDirty||cloudBusy||!cloudUser)return;cloudBusy=true;cloudDirty=false;let snapshot=JSON.parse(JSON.stringify(data));try{let {data:r,error}=await cloudClient.rpc('studio_save_document',{expected_revision:cloudRevision,new_content:snapshot});if(error)throw error;cloudRevision=r;cloudStatus('✓ Saved locally and synchronized')}catch(e){cloudReady=false;cloudDirty=true;cloudStatus('Sync paused: '+e.message+'. Download or resolve before continuing.');alert('Cloud sync paused to protect your work. Your edits remain on this device. Export a JSON backup before resolving.')}finally{cloudBusy=false;if(cloudReady&&cloudDirty)cloudQueue()}}
async function cloudSyncNow(){if(!cloudUser)return cloudStatus('Sign in first');if(!cloudReady)return cloudStatus('Choose initial Download or Upload first');flushEditor();if(cloudDirty){await cloudPush();return}try{let row=await cloudFetch();if(row&&row.revision!==cloudRevision){cloudReady=false;cloudStatus('Changes found on another device. Export local backup, then download the cloud library.')}else cloudStatus('✓ Up to date')}catch(e){cloudStatus(e.message)}}
window.addEventListener('focus',()=>{if(cloudReady)cloudSyncNow()});
window.addEventListener('online',()=>{if(cloudReady)cloudSyncNow()});
if(cloudConfig()?.url)cloudInitialize();
</script></body></html>
